<title>Mountain Tefillah (Traditional)</title>
<style>

  #scrim.tall { background: linear-gradient(180deg, rgba(5,30,78,var(--sa)) 0%, rgba(5,30,78,calc(var(--sa)*.85)) 70%, rgba(5,30,78,calc(var(--sa)*.5)) 100%); }
  .slide { color: #fff; font-family: Calibri, Carlito, "Helvetica Neue", Arial, sans-serif;

  .dots { left: 0; right: 0; top: calc(var(--in)*.2); text-align: center; font-size: calc(var(--pt)*22); letter-spacing: .35em; }
  .h-en { left: calc(var(--in)*.45); top: calc(var(--in)*.12); font-size: calc(var(--pt)*32); }
  .h-he { right: calc(var(--in)*.45); top: calc(var(--in)*.02); font-size: calc(var(--pt)*42); }

  /* ---------- title card ---------- */
  #title { position: absolute; left: 0; right: 0; top: 26%; text-align: center; color: #fff;
           font-family: Calibri, Carlito, "Helvetica Neue", Arial, sans-serif;

  /* ---------- mini-map ---------- */
  #map { position: absolute; left: calc(var(--in)*.45); bottom: calc(var(--in)*.85); width: calc(var(--in)*6.4);

  #map svg { display: block; width: 100%; height: auto; overflow: visible; }

  #guide { position: absolute; background: rgba(5,48,94,.84); border: calc(var(--pt)*1.5) solid rgba(255,255,255,.28); border-radius: calc(var(--pt)*14);
           padding: calc(var(--pt)*14) calc(var(--pt)*22) calc(var(--pt)*12); box-sizing: border-box; opacity: 0;
           pointer-events: none; color: #fff; font-family: Calibri, Carlito, "Helvetica Neue", Arial, sans-serif; line-height: 1.22; cursor: move; user-select: none; }
  #guide.on { opacity: 1; pointer-events: auto; transition: opacity .7s ease; }   /* fades in, and simply goes when its moment is over */
  #guide h4 { margin: 0 0 .2em; font-size: .73em; font-weight: 700; color: #FFC843; letter-spacing: .04em; text-transform: uppercase; }
  #guide h4 .who { display: block; margin-top: .15em; font-size: .78em; font-weight: 400; color: #fff; opacity: .85; letter-spacing: 0; text-transform: none; }
  #guide ul { margin: 0; padding-left: 1em; } #guide li { margin: .23em 0; }
  #guide .tools { position: absolute; right: calc(var(--pt)*10); top: calc(var(--pt)*6); display: none; gap: 4px; font-size: calc(var(--pt)*15); }
  #guide:hover .tools { display: flex; } #guide:hover { border-color: rgba(255,200,67,.8); }
  #guide .tools span { cursor: pointer; background: rgba(255,255,255,.18); border-radius: 4px; padding: 0 .5em; line-height: 1.5; }
  #guide .grip { position: absolute; right: 0; bottom: 0; width: calc(var(--pt)*26); height: calc(var(--pt)*26); cursor: ew-resize; display: none;

  /* ---------- toolbar (lower left), map close, view adjusting ---------- */

                  background: rgba(5,48,94,.72); border: 1px solid rgba(255,255,255,.3); border-radius: calc(var(--pt)*10); padding: calc(var(--pt)*4); opacity: .5; transition: opacity .25s; }

  /* ---------- control panel (for the person at the computer) ---------- */

           border-radius: calc(var(--pt)*16); padding: calc(var(--pt)*22) calc(var(--pt)*28); box-sizing: border-box; cursor: default;

  #panel input.who::placeholder { color: rgba(255,255,255,.4); font-style: italic; } #panel input.who:focus { outline: none; border-color: #FFC843; background: rgba(255,255,255,.18); }

  #panel input { width: 1.05em; height: 1.05em; vertical-align: -.12em; margin-right: .45em; accent-color: #FFC843; }
  #panel .bar { display: flex; flex-wrap: wrap; gap: .7em; align-items: center; margin-top: .9em; padding-top: .8em; border-top: 1px solid rgba(255,255,255,.25); }
  #panel button { font: inherit; font-weight: 600; color: #05305E; background: #fff; border: 0; border-radius: .45em; padding: .4em .9em; cursor: pointer; }
  #panel button.main { background: #FFC843; }
  #panel .ib { width: 2.5em; height: 2.5em; padding: .5em; background: rgba(255,255,255,.14); color: #fff; } #panel .ib:hover { background: rgba(255,255,255,.3); color: #FFC843; }
  #panel .ib svg, #panel .ic svg { width: 100%; height: 100%; display: block; pointer-events: none; } #panel .ic { width: 1.3em; height: 1.3em; color: #FFC843; }
  #dlg .card { position: absolute; right: calc(var(--pt)*28); bottom: calc(var(--pt)*86); width: 24em; background: #0a3a6e; border: 1px solid #FFC843; border-radius: .7em; padding: 1em 1.2em; box-shadow: 0 .4em 1.6em rgba(0,0,0,.5); }
  #dlg h3 { margin: 0 0 .6em; font-size: 1.2em; } #dlg p { margin: .7em 0; font-size: .85em; opacity: .85; line-height: 1.3; }
  #dlg input[type=text] { width: 100%; box-sizing: border-box; height: auto; font: inherit; padding: .4em .6em; border-radius: .4em; border: 0; margin: 0; }
  #dlg input[type=text]:disabled { background: #9aa7b6; color: #3c4a5a; }
  #dlg .chk { font-size: .85em; text-align: right; opacity: .9; margin-top: .35em; } #dlg .chk input { width: .95em; height: .95em; }
  #dlg .row { display: flex; justify-content: flex-end; gap: .6em; } #panel .under { opacity: .6; font-weight: 400; font-style: italic; color: #fff; }
  #panel .switch { display: inline-flex; align-items: center; gap: .7em; margin-right: auto; font-size: 1.15em; font-weight: 600; }
  #panel .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  #panel .switch i { width: 3.2em; height: 1.7em; border-radius: 1em; background: rgba(255,255,255,.28); position: relative; transition: background .2s; flex: none; }
  #panel .switch i::after { content: ""; position: absolute; left: .18em; top: .18em; width: 1.34em; height: 1.34em; border-radius: 50%; background: #fff; transition: left .2s; }
  #panel .switch input:checked + i { background: #FFC843; } #panel .switch input:checked + i::after { left: 1.68em; }
  #print { display: none; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; display: block; } #stage { display: none !important; }
    #print { display: block; color: #000; font: 13pt/1.4 Calibri, Carlito, Arial, sans-serif; padding: 0 .2in; }
    #print h1 { font-size: 20pt; margin: 0 0 .1in; } #print h2 { font-size: 14pt; margin: .22in 0 .04in; break-after: avoid; } #print h3 { font-size: 12pt; margin: .12in 0 0; font-style: italic; font-weight: 400; }
    #print ul { margin: .04in 0; } #print li { margin: .05in 0; } #print section { break-inside: avoid; } #print .who { float: right; font-weight: 400; border-bottom: 1px solid #000; min-width: 2in; } #print .who.named { border: 0; min-width: 0; font-size: 10.5pt; font-style: italic; max-width: 3.6in; text-align: right; }
  }
  .still .slide, .still #scrim, .still #map, .still #title, .still #guide { transition: none; }
  #fps { position: absolute; right: 8px; top: 6px; color: #fff; font: 12px monospace; opacity: .8; display: none; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #fff;
         font: 20px Calibri, sans-serif; text-align: center; padding: 40px; }
</style>

    <button id="tbScript" title="Guide’s script on screen (S)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3 H20 A2 2 0 0 1 22 5 V15 A2 2 0 0 1 20 17 H11 L6 21.5 V17 H4 A2 2 0 0 1 2 15 V5 A2 2 0 0 1 4 3 Z"/><rect x="6" y="7" width="12" height="1.9" rx=".9" fill="#05305E"/><rect x="6" y="11" width="8" height="1.9" rx=".9" fill="#05305E"/></svg></button>
    <button id="tbMap" title="Map (M)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 20 L9 6 L13 13 L16 9 L23 20 Z"/><path d="M9 6 L7.2 9.2 L9 10.4 L10.6 9.2 Z" fill="#05305E" opacity=".55"/></svg></button>

<script>
(function () {
'use strict';
const stage = document.getElementById('stage');
if (/[?&]still/.test(location.search)) stage.classList.add('still');   // no fades, for checking layouts
function fail(msg) { const e = document.getElementById('err'); e.style.display = 'flex'; e.textContent = msg; }
if (!window.THREE) return fail('Could not load vendor/three.min.js. Keep the vendor folder next to index.html.');
if (!window.SLIDES_HTML) return fail('slides.js is missing. Run build.py on the Mac to create it.');

/* =====================================================================
   Helpers
   ===================================================================== */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t * t * t * (t * (6 * t - 15) + 10);
const lerpAngle = (a, b, t) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; };
const DEG = Math.PI / 180;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(ix, iz) { const n = Math.sin(ix * 127.1 + iz * 311.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z, o) { let s = 0, a = .5, f = 1; for (let i = 0; i < (o || 4); i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= .5; } return s; }
function ridged(x, z) { let s = 0, a = .5, f = 1; for (let i = 0; i < 4; i++) { const n = 1 - Math.abs(2 * vnoise(x * f, z * f) - 1); s += a * n * n; f *= 2.1; a *= .5; } return s; }

/* =====================================================================
   The mountain. +x is east (sunrise), +z is south. Summit at the origin.
   ===================================================================== */
const WATER = 9;
function heightRaw(x, z) {
  const r = Math.hypot(x, z);
  let h = 240 * Math.exp(-Math.pow(r / 260, 1.7));
  h *= 0.88 + 0.24 * fbm(x / 120 + 3.1, z / 120 + 7.7, 3);
  h += 14 * (fbm(x / 40, z / 40, 4) - 0.47);
  h += 26 * (fbm(x / 210 + 5, z / 210 + 1, 3) - 0.3) * sstep(300, 520, r);
  h += sstep(560, 1200, r) * (30 + 260 * ridged(x / 520 + 11.3, z / 520 + 4.2));
  if (h < WATER + 1.2) h = WATER + 1.2 - (WATER + 1.2 - h) * 5;      // steep shores and deep beds, so water and ground never sit close enough to shimmer
  return h;
}

// One loop: up from the woods to the summit, then down the north-east side back to the trailhead.
const TRAIL = [
  [362,-292],[352,-272],[340,-252],[332,-236],[318,-212],[308,-196],[298,-180],[288,-158],[278,-138],[268,-118],
  [262,-104],[251,-78],[240,-54],[228,-30],[214,-2],[192,26],[166,46],[146,72],[112,102],[74,120],
  [44,124],[22,114],[6,96],[-4,72],[-6,48],[-3,26],[0,10],[0,0],
  [8,-16],[28,-42],[58,-76],[95,-110],[140,-150],[190,-186],[240,-214],[282,-226],[306,-222],[322,-208]];
const EYE = 2.6;
let curve, L;
(function buildCurve() {
  const flat = new THREE.CatmullRomCurve3(TRAIL.map(p => new THREE.Vector3(p[0], 0, p[1])), false, 'centripetal');
  const N = Math.round(flat.getLength() / 4.5), pts = flat.getSpacedPoints(N), ys = pts.map(p => heightRaw(p.x, p.z));
  for (let pass = 0; pass < 3; pass++) for (let i = 1; i < N; i++) ys[i] = (ys[i - 1] + 2 * ys[i] + ys[i + 1]) / 4;
  pts.forEach((p, i) => { p.y = lerp(ys[i], Math.max(ys[i], heightRaw(p.x, p.z)), .6) + EYE; });
  curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  L = curve.getLength();

  panel.innerHTML = '<div class="x" id="btnX" title="Close">×</div><h2>Prayer List</h2><div class="sub">Untick a prayer to skip it; untick a whole stop and we walk past it. ' + (ROUTE.length) + ' stops, ' + slides + ' text slides, ' + (STEPS.length - 1 - (showScript ? 0 : STEPS.filter(s => s.k === 'turn').length)) + ' clicks. Choices are remembered on this computer.' + (designName ? ' Design: <b>' + esc(designName) + '</b>.' : '') + '</div><div class="cols">' +
    ORDER.map(o => { const st = STOPS[o.stop], all = o.prayers.every(isOn), some = o.prayers.some(isOn);
      return '<div class="stop"><label><input type="checkbox" data-stop="' + o.stop + '"' + (some ? ' checked' : '') + (some && !all ? ' data-part="1"' : '') + '>' + esc(st.place.charAt(0).toUpperCase() + st.place.slice(1)) + (st.note ? ' <span class="under">(' + st.note + ')</span>' : '') + '</label>' +
        o.prayers.map(p => '<div class="prow"><label class="pr"><input type="checkbox" data-p="' + p.id + '"' + (isOn(p) ? ' checked' : '') + '>' + esc(p.name) + '</label><input type="text" class="who" data-n="' + p.id + '" maxlength="40" placeholder="name" title="Who leads ' + esc(p.name).replace(/"/g, '&quot;') + '" value="' + esc(names[p.id] || '').replace(/"/g, '&quot;') + '"></div>').join('') +
        (o.stop === 'tents' ? '<div class="later">Nisim B’chol Yom side loop: coming later</div>' : '') + '</div>'; }).join('') +
    '</div><div class="bar"><label class="switch"><input type="checkbox" id="optScript"' + (showScript ? ' checked' : '') + '><i></i><span class="ic">' + IC.script + '</span>Guide’s script on screen (S)</label>' +
    '<button class="ib" id="btnPrint" title="Print the guides’ script for the ticked prayers">' + IC.print + '</button>' +
    '<button class="ib" id="btnTxt" title="Save the guides’ script as a text file">' + IC.doc + '</button>' +
    '<button class="ib" id="btnOpen" title="Open a saved design (a file made with the save button)">' + IC.open + '</button>' +
    '<button class="ib" id="btnSave" title="Save this design: prayer choices, views and script boxes">' + IC.save + '</button>' +
    '<button class="ib" id="btnReset" title="Reset this computer to the defaults">' + IC.reset + '</button></div><div id="dlg"></div><input type="file" id="fileOpen" accept=".js,.json,.txt" style="display:none">';
  panel.querySelectorAll('input[data-part]').forEach(i => { i.indeterminate = true; });
}
function applyChoice() { save(); buildSteps(); enter(0, -1); drawPanel(); }
panel.addEventListener('click', e => e.stopPropagation());
panel.addEventListener('input', e => {                   // a guide's name: saved as it is typed, on screen at once
  const t = e.target; if (!t.dataset.n) return;
  if (t.value.trim()) names[t.dataset.n] = t.value; else delete names[t.dataset.n]; save(); showGuide(STEPS[idx]);
});
panel.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.p) { sel[t.dataset.p] = t.checked; applyChoice(); }
  else if (t.dataset.stop) { ORDER.find(o => o.stop === t.dataset.stop).prayers.forEach(p => { sel[p.id] = t.checked; }); applyChoice(); }
  else if (t.id === 'optScript') setScript(t.checked);
});
function loadDesign(d, name) {                           // replace this computer's choices with a design (or the defaults)
  for (const k in sel) delete sel[k]; Object.assign(sel, d.sel); for (const k in names) delete names[k]; Object.assign(names, d.names); for (const k in viewAdj) delete viewAdj[k]; Object.assign(viewAdj, d.views);
  for (const k in guideBox) delete guideBox[k]; for (const k in (d.guide || {})) guideBox[k] = Object.assign({}, d.guide[k]);
  showScript = !!d.script; designName = name || ''; document.getElementById('tbScript').classList.toggle('act', showScript); applyChoice();
}
function saveDesign(name, asDefault) {
  designName = asDefault ? '' : name; save();
  const txt = '// Mountain Tefillah design: prayer choices, camera views and script box places.\r\n// Open it from the Prayer List (folder icon). A file named defaults.js next to index.html is what every computer starts from.\r\nwindow.DEFAULTS = ' + JSON.stringify(settings(), null, 2) + ';\r\n';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/javascript' }));
  a.download = (asDefault ? 'defaults' : name.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'design') + '.js'; document.body.appendChild(a); a.click(); a.remove();
}
const dlg = html => { document.getElementById('dlg').innerHTML = html ? '<div class="card">' + html + '</div>' : ''; };
let typedName = '';
panel.addEventListener('click', e => {
  const b = e.target.closest('button, .x'), id = b && b.id; if (!id) return;
  if (id === 'btnPrint') printScript(); else if (id === 'btnTxt') downloadScript(); else if (id === 'btnX') togglePanel(false);
  else if (id === 'btnOpen') document.getElementById('fileOpen').click();
  else if (id === 'btnSave') { typedName = designName;
    dlg('<h3>Save this design</h3><input type="text" id="svName" maxlength="60" placeholder="Name it, e.g. Maya’s service" value="' + esc(designName).replace(/"/g, '&quot;') + '">' +
      '<label class="chk"><input type="checkbox" id="svDef">save as default</label>' +
      '<p>The file goes to your Downloads folder. Open a named design later with the folder icon. To make a default for every computer, move defaults.js into the Mountain Tefillah folder, replacing the one there.</p>' +
      '<div class="row"><button id="dlgNo">Cancel</button><button class="main" id="svGo">Save</button></div>'); document.getElementById('svName').focus(); }
  else if (id === 'btnReset') dlg('<h3>Reset this computer?</h3><p>Prayer choices, views and script box places changed on this computer will go back to the defaults. Saved design files are not touched.</p><div class="row"><button id="dlgNo">Cancel</button><button class="main" id="rsGo">Reset</button></div>');
  else if (id === 'dlgNo') dlg('');
  else if (id === 'rsGo') loadDesign(DEF, DEF.name);
  else if (id === 'svGo') { const def = document.getElementById('svDef').checked, name = document.getElementById('svName').value.trim(); if (!def && !name) return document.getElementById('svName').focus(); saveDesign(name, def); drawPanel(); }
});
panel.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'svDef') { const n = document.getElementById('svName'); if (t.checked) { typedName = n.value; n.value = 'default'; n.disabled = true; } else { n.value = typedName; n.disabled = false; n.focus(); } }
  else if (t.id === 'fileOpen' && t.files[0]) { const file = t.files[0], rd = new FileReader();
    rd.onload = () => { try { const txt = String(rd.result), d = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1)); loadDesign(d, d.name || file.name.replace(/\.[^.]+$/, '')); }
      catch (err) { dlg('<h3>That file could not be read</h3><p>Choose a design file saved from this page.</p><div class="row"><button class="main" id="dlgNo">OK</button></div>'); } };
    rd.readAsText(file); }
});
panel.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && e.target.id === 'svName') document.getElementById('svGo').click(); if (e.key === 'Escape') { if (document.getElementById('dlg').innerHTML) dlg(''); else togglePanel(false); } });
function togglePanel(on) { if (on == null) on = !panel.classList.contains('on'); if (on) drawPanel(); panel.classList.toggle('on', on); document.getElementById('tbList').classList.toggle('act', on); }
function setBar(off) { barOff = off; stage.classList.toggle('barOff', off); save(); }
document.getElementById('bar').addEventListener('click', e => {
  e.stopPropagation(); const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'tbList') togglePanel(); else if (b.id === 'tbScript') setScript(!showScript); else if (b.id === 'tbMap') toggleMap(); else if (b.id === 'tbView') setAdjust(!adjusting); else if (b.id === 'tbHide') setBar(true);
});
document.getElementById('barTab').addEventListener('click', e => { e.stopPropagation(); setBar(false); });
stage.classList.toggle('barOff', barOff); document.getElementById('tbScript').classList.toggle('act', showScript);

const SPEED = 4.6;                                // world units per second while travelling
let autoNext = false;                             // (arrivals wait for a click; kept so an automatic mode can be added later)
let idx = 0, travelP = 0, travelling = false, travelDur = 12, todFrom = 0, tod = 0, todTarget = 0, glide = null;
const titleEl = document.getElementById('title'), scrimEl = document.getElementById('scrim');
function showText(id, stop) {
  document.querySelectorAll('.slide.on').forEach(e => e.classList.remove('on'));
  const s = id && document.getElementById(id);
  if (s) { s.classList.add('on'); stage.style.setProperty('--sa', STOPS[stop].sa); scrimEl.classList.toggle('tall', s.dataset.scrim === 'tall'); }
  scrimEl.classList.toggle('on', !!s && s.dataset.scrim !== 'none');
}
function enter(i, dir) {
  idx = clamp(i, 0, STEPS.length - 1); const s = STEPS[idx];
  if (s.k === 'turn' && !showScript) return enter(idx + (dir > 0 ? 1 : -1), dir);   // no script on screen, no pause: straight on to the text
  glide = null; autoNext = false; let post = null;
  titleEl.classList.toggle('on', s.k === 'hold'); if (dir > 0 && mapAuto(s)) mapOff = false; showMap();
  if (s.k === 'slide' || s.k === 'turn') {
    // text fades out, the camera moves to this prayer's view, then the new text fades in
    const pose = s.pose; s.dp = 0; setMap(s.mi, s.mi, 0, true); if (s.k === 'slide') todTarget = s.tod;
    const moved = pose.pos.distanceTo(cur.pos) > .5 || Math.abs(lerpAngle(cur.yaw, pose.aim.yaw, 1) - cur.yaw) > .02 || Math.abs(pose.aim.pitch - cur.pitch) > .02 || Math.abs(pose.zoom - cur.zoom) > .01;
    const go = dir > 0 && moved, after = s.k === 'slide' ? () => showText(s.id, s.stop) : null;   // a turn, like an arrival, waits for a click so the guide can speak
    showText(s.k === 'slide' && !go ? s.id : null, s.stop);
    if (go) glide = { pos0: cur.pos.clone(), y0: cur.yaw, p0: cur.pitch, z0: cur.zoom, to: pose, t: 0, then: after, dur: Math.abs(pose.aim.pitch - cur.pitch) > .5 || pose.pos.distanceTo(cur.pos) > 14 ? 5 : 3.6 };
    else { toPose(pose); if (dir <= 0 && s.k === 'slide') tod = s.tod; if (s.k === 'turn') post = after; }
  } else if (s.k === 'hold') {
    showText(null); todTarget = tod = STOPS[s.stop].tod[0]; toPose(s.pose); setMap(s.mi, s.mi, 0, true);
  } else {
    showText(null);
    const was = STEPS[idx - 1];                            // after a slow walk (the bridge), carry on from wherever we have got to
    s.A = dir > 0 && was && was.drift && was.dp > 0 ? { u: was.du, aim: { yaw: cur.yaw, pitch: cur.pitch }, zoom: cur.zoom, d: was.pose.d } : (s.A0 || s.A);
    travelDur = clamp(Math.abs(s.B.u - s.A.u) * L / (STOPS[s.to].speed || SPEED), 9, 34);
    todTarget = STOPS[s.to].tod[0];
    if (dir > 0) { travelP = 0; travelling = true; todFrom = tod; } else { travelP = 1; travelling = false; todFrom = tod = todTarget; }
  }
  showGuide(s); if (adjusting) document.getElementById('adjName').textContent = curPose().label;
  if (post) post();
  try { history.replaceState(null, '', '#' + idx); } catch (e) {}
}
function next() { const s = STEPS[idx]; if (s.k === 'travel' && travelling) { travelP = 1; return; } if (idx < STEPS.length - 1) enter(idx + 1, 1); }
function prev() { if (idx > 0) enter(idx - 1, -1); }
addEventListener('keydown', e => {
  if (e.key === 'Escape' && panel.classList.contains('on')) return togglePanel(false);
  if ((e.key === 'c' || e.key === 'C') && !(e.target && e.target.tagName === 'INPUT')) return togglePanel();
  if (panel.classList.contains('on')) return;
  if (adjusting && adjustKey(e)) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  else if (e.key === 'p' || e.key === 'P') { fpsEl.style.display = fpsEl.style.display === 'block' ? 'none' : 'block'; }
  else if (e.key === 's' || e.key === 'S') setScript(!showScript);
  else if (e.key === 'm' || e.key === 'M') toggleMap();
  else if (e.key === 'v' || e.key === 'V') setAdjust(!adjusting);
  else if (e.key === 'Home') enter(0, -1);
});
stage.addEventListener('click', () => { if (!panel.classList.contains('on') && !adjusting) next(); });
buildSteps();

/* =====================================================================
   Layout and the frame loop
   ===================================================================== */
function layout() {
  const w = Math.min(innerWidth, innerHeight * ASPECT), h = w / ASPECT;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  document.documentElement.style.setProperty('--in', (w / 20) + 'px');
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5)); renderer.setSize(w, h, false);
  camera.aspect = ASPECT; camera.updateProjectionMatrix();
}
addEventListener('resize', layout); layout();

const fpsEl = document.getElementById('fps'), tmpV = new THREE.Vector3(); let fAcc = 0, fN = 0, last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now; clock += dt;
  const s = STEPS[idx];
  if (s.k === 'travel') {
    if (travelling) { travelP = Math.min(1, travelP + dt / travelDur); if (travelP >= 1) travelling = false; }
    const e = poseTravel(s.A, s.B, travelP), arrived = travelP >= 1 && autoNext;
    tod = lerp(todFrom, todTarget, e); setMap(s.mi - 1, s.mi, e, travelP >= 1);
    if (arrived) { autoNext = false; if (!adjusting && !guideEl.classList.contains('on')) enter(idx + 1, 1); }
  } else {
    if (glide) {                                                  // a few steps along the trail between slides
      glide.t = Math.min(1, glide.t + dt / glide.dur); const e = ease(glide.t);
      tmpP.copy(glide.pos0).lerp(glide.to.pos, e); tmpP.y = Math.max(tmpP.y, height(tmpP.x, tmpP.z) + 1.3);
      setPose(tmpP, lerpAngle(glide.y0, glide.to.aim.yaw, e), lerp(glide.p0, glide.to.aim.pitch, e), lerp(glide.z0, glide.to.zoom, e));
      if (glide.t >= 1) { const g = glide; glide = null; if (g.then) g.then(); }
    }
    else if (s.drift && !adjusting) {                             // the bridge: we walk slowly across while the words are up
      s.dp = Math.min(1, (s.dp || 0) + dt / s.drift.secs); const e = lerp(s.dp, ease(s.dp), .5), u = s.du = lerp(s.pose.u, s.drift.to, e);
      const a = viewAdj[s.pose.key] || {}, pa = pathAim(u, -2), w = sstep(0, .12, s.dp);
      tmpP.copy(curve.getPointAt(u)).add(s.pose.d);
      setPose(tmpP, lerpAngle(s.pose.aim.yaw, pa.yaw + (a.y || 0), w), lerp(s.pose.aim.pitch, pa.pitch + (a.p || 0), w), s.pose.zoom);
    }
    tod += (todTarget - tod) * (1 - Math.exp(-dt / 10));           // light keeps changing slowly while we pray
  }
  applyTOD(tod); animateWind(clock);
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  clouds.forEach(c => { const az = SUN_AZ + c.az + clock * 0.0009; c.s.position.set(camera.position.x + Math.cos(c.el) * Math.cos(az) * 6000, camera.position.y + Math.sin(c.el) * 6000, camera.position.z + Math.cos(c.el) * Math.sin(az) * 6000); });
  tmpV.copy(sunDir); if (tmpV.y < .12) tmpV.y = .12;
  sunLight.position.copy(camera.position).addScaledVector(tmpV, 500); sunLight.target.position.copy(camera.position);
  renderer.render(scene, camera);
  fAcc += dt; fN++; if (fAcc > .5) { fpsEl.textContent = Math.round(fN / fAcc) + ' fps'; fAcc = 0; fN = 0; }
  requestAnimationFrame(frame);
}
const startAt = parseInt((location.hash || '').slice(1), 10);
enter(0, -1); if (startAt > 0) for (let i = 1; i <= startAt && i < STEPS.length; i++) enter(i, -1);
window.__mt = { curve, CAIRNS, enter, get STEPS() { return STEPS; }, STOPS, camera, L, cur, aimAt, pathAim, setPose, sel, apply: () => applyChoice(), sections: scriptSections,
  at: id => { const n = STEPS.findIndex(s => s.k === 'slide' && s.id === id); for (let j = 0; j <= n; j++) enter(j, -1); return n; },
  arrive: stop => { const n = STEPS.findIndex(s => s.k === 'travel' && s.to === stop); for (let j = 0; j <= n; j++) enter(j, -1); return n; },
  setTod: v => { tod = todTarget = v; }, seek: p => { travelP = p; travelling = false; }, fps: () => fpsEl.textContent };
requestAnimationFrame(frame);
})();
</script>
