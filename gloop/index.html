<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gloop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8E9E3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Gloop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* Layout: one-screen app — slim header (mode switch · live readout · tools), a framed gesso "palette slab" for play, a tray along the bottom that each mode fills. Deliberately single (light) theme: paint reads on primed canvas. */
:root{
  --gesso:#E8E9E3;
  --slab:#F1F2EC;
  --ink:#24252C;
  --muted:#6A6C73;
  --rim:rgba(36,37,44,.14);
  --well-shadow:rgba(20,20,30,.22);
  --gold:#B8892B;
  --font-ui:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--gesso); color:var(--ink); font-family:var(--font-ui);
  overflow:hidden; touch-action:none; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; color:inherit}
.app{height:100%; display:flex; flex-direction:column; padding-inline:16px; box-sizing:border-box}
.top{display:flex; align-items:center; gap:10px; padding-block:10px}
.modebtn{border:0; background:transparent; padding:4px 6px 4px 0; display:flex; flex-direction:column; align-items:flex-start; line-height:1; cursor:pointer; border-radius:10px}
.modebtn .mark{font-weight:800; font-size:22px; letter-spacing:-.02em; font-variation-settings:"opsz" 96}
.modebtn .sub{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:3px; display:flex; gap:4px; align-items:center}
.modebtn .sub svg{width:10px; height:10px}
.hud{flex:1; min-width:0; display:flex; align-items:center; gap:8px; justify-content:center}
.hud .sw{width:22px; height:22px; border-radius:50%; background:var(--slab); box-shadow:inset 0 0 0 1px var(--rim); flex:none; transition:background .3s}
.hud .sw[hidden]{display:none}
.hud .txt{display:flex; flex-direction:column; line-height:1.1; min-width:0}
.hud small{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.hud b{font-weight:500; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:2px}
.icon{width:40px; height:40px; border:0; border-radius:12px; background:transparent; display:grid; place-items:center; cursor:pointer}
.icon:active{background:var(--rim)}
.icon:focus-visible,.well:focus-visible,.modebtn:focus-visible,.btn:focus-visible,.pick:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.icon svg{width:22px; height:22px}
#tilt[aria-pressed="true"]{background:var(--ink); color:var(--slab)}
#snd[aria-pressed="false"] .on{display:none}
#snd[aria-pressed="true"] .off{display:none}
.board{flex:1; min-height:0; position:relative; border-radius:20px; overflow:hidden; background:var(--slab); box-shadow:inset 0 0 0 1px var(--rim)}
canvas{display:block; width:100%; height:100%; touch-action:none}
.hint{position:absolute; left:0; right:0; bottom:18px; margin:0; text-align:center; font-size:13px; line-height:1.5; color:var(--muted); pointer-events:none; transition:opacity .6s; padding-inline:16px}
.hint.hide{opacity:0}
.toast{position:absolute; left:50%; top:14px; transform:translateX(-50%); width:max-content; max-width:calc(100% - 32px); box-sizing:border-box; padding:8px 14px; border-radius:12px; background:var(--ink); color:var(--slab); font-size:13px; line-height:1.35; text-align:center; pointer-events:none; opacity:0; transition:opacity .3s}
.toast.show{opacity:1}
.sheet{position:absolute; inset:0; display:flex; padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; background:rgba(232,233,227,.72); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); box-sizing:border-box}
.card{width:100%; max-width:340px; margin:auto; background:var(--slab); border-radius:20px; padding:20px; box-shadow:0 10px 40px rgba(20,20,30,.18), inset 0 0 0 1px var(--rim); display:flex; flex-direction:column; gap:14px; box-sizing:border-box}
.card h2{margin:0; font-size:24px; font-weight:800; letter-spacing:-.02em; text-wrap:balance; font-variation-settings:"opsz" 96}
.card p{margin:0; color:var(--muted); font-size:14px; line-height:1.45}
.card .big{font-size:44px; font-weight:800; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
.stars{display:flex; gap:6px}
.stars span{width:18px; height:18px; border-radius:50%; background:var(--rim)}
.stars span.on{background:var(--gold); box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.btns{display:flex; gap:10px; flex-wrap:wrap}
.btn{flex:1; min-width:120px; border:0; border-radius:14px; padding:13px 16px; font-size:15px; font-weight:500; cursor:pointer; background:var(--gesso); box-shadow:inset 0 0 0 1px var(--rim)}
.btn.primary{background:var(--ink); color:var(--slab); box-shadow:none}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pick{display:flex; flex-direction:column; gap:8px; align-items:flex-start; text-align:left; border:0; border-radius:16px; padding:12px; background:var(--gesso); box-shadow:inset 0 0 0 1px var(--rim); cursor:pointer; min-width:0}
.pick[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.pick canvas{width:48px; height:48px; flex:none; border-radius:12px}
.pick b{display:block; font-size:16px; font-weight:800; letter-spacing:-.01em}
.pick span{display:block; font-size:12px; color:var(--muted); line-height:1.3; margin-top:2px}
.tray{display:flex; flex-direction:column; align-items:center; gap:6px; padding-block:12px 8px; min-height:74px; box-sizing:border-box; justify-content:center}
.wells{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
.well{width:46px; height:46px; border-radius:50%; border:0; cursor:pointer; padding:0;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.16), inset 0 3px 4px rgba(255,255,255,.35), 0 2px 5px var(--well-shadow);
  transition:transform .15s}
.well[aria-pressed="true"]{transform:translateY(-4px); outline:3px solid var(--ink); outline-offset:3px}
.traynote{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:center}
.queue{display:flex; gap:10px; align-items:center}
.queue i{width:18px; height:18px; border-radius:50%; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 1px 3px var(--well-shadow); transition:opacity .3s, transform .3s}
.queue i.used{opacity:.18; transform:scale(.7)}
.queue i.next{transform:scale(1.3)}
@media (prefers-reduced-motion: reduce){ .well,.hint,.hud .sw,.toast,.queue i{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="modebtn" id="modeBtn" aria-label="Choose a game">
      <span class="mark">Gloop</span>
      <span class="sub"><span id="modeName">Studio</span><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"/></svg></span>
    </button>
    <div class="hud" aria-live="polite">
      <span class="sw" id="hudSw"></span>
      <span class="txt"><small id="hudLabel">Last mix</small><b id="hudValue">Nothing yet</b></span>
    </div>
    <div class="tools">
      <button class="icon" id="tilt" aria-pressed="false" aria-label="Tilt to move paint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="9" height="16" rx="2" transform="rotate(15 12.5 11)"/><path d="M3 15a9 9 0 0 0 4 5M21 9a9 9 0 0 0-4-5"/></svg>
      </button>
      <button class="icon" id="snd" aria-pressed="true" aria-label="Sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon" id="act" aria-label="Clear the board"></button>
    </div>
  </header>
  <div class="board">
    <canvas id="board"></canvas>
    <p class="hint" id="hint"></p>
    <div class="toast" id="toast" role="status"></div>
    <div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
  </div>
  <nav class="tray" id="tray" aria-label="Controls"></nav>
</div>

<script>
(() => {
const TAU = Math.PI * 2, N = 28, STEP = 1 / 120;
const PAINTS = [
  { name: 'Cadmium Red',    c: [0.84, 0.12, 0.17] },
  { name: 'Lemon Yellow',   c: [0.98, 0.84, 0.14] },
  { name: 'Ultramarine',    c: [0.10, 0.23, 0.75] },
  { name: 'Titanium White', c: [0.97, 0.97, 0.95] },
  { name: 'Ivory Black',    c: [0.11, 0.11, 0.13] },
];
const ICONS = {
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg>',
};
const $ = id => document.getElementById(id);
const cv = $('board'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, bg = null;
let blobs = [], nextId = 1;
const pointers = new Map();
const store = {
  get(k, d) { try { const v = localStorage.getItem('gloop.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('gloop.' + k, JSON.stringify(v)); } catch (_) {} },

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- colour ---------- */
const css = (c, a) => a == null ? `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})` : `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`;
// Subtractive-ish mix: area-weighted geometric mean per channel (blue + yellow → green), then a small chroma lift.

}
function hsl([r, g, b]) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;

}
const HUES = [[12,'Red'],[24,'Vermilion'],[40,'Orange'],[52,'Amber'],[66,'Yellow'],[90,'Chartreuse'],[155,'Green'],[180,'Teal'],[205,'Cerulean'],[240,'Blue'],[265,'Indigo'],[292,'Violet'],[325,'Magenta'],[348,'Rose'],[361,'Red']];
// CIE Lab distance (ΔE76): about 2 is barely visible, 10 reads as "close", 30+ as a different colour.
function lab(c) {
  const f = v => v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4), h = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const r = f(c[0]), g = f(c[1]), b = f(c[2]);
  const x = h((r * .4124 + g * .3576 + b * .1805) / .95047), y = h(r * .2126 + g * .7152 + b * .0722), z = h((r * .0193 + g * .1192 + b * .9505) / 1.08883);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];

function deltaE(a, b) { const A = lab(a), B = lab(b); return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]); }
function nameColor(c) {
  const [h, s, l] = hsl(c);
  if (s < .12 || l < .06) return l < .2 ? 'Charcoal' : l < .4 ? 'Slate' : l < .65 ? 'Grey' : l < .85 ? 'Silver' : 'Chalk';

  if (l < .38 && h >= 15 && h < 50) base = 'Brown';
  else if (l < .42 && h >= 50 && h < 80) base = 'Olive';
  else if (l > .72 && (h < 15 || h >= 330)) base = 'Pink';
  const mod = l < .22 ? 'Deep ' : l > .78 ? 'Pale ' : s < .3 ? 'Dusty ' : s < .5 && l < .45 ? 'Muddy ' : '';
  return mod + base;
}

/* ---------- header, tray, sheet, toast ---------- */
let hudKey = '';
function hud(label, value, swatch) {
  const key = label + '|' + value + '|' + (swatch ? swatch.map(v => (v * 64) | 0).join() : '');
  if (key === hudKey) return; hudKey = key;
  $('hudLabel').textContent = label; $('hudValue').textContent = value;
  const sw = $('hudSw'); sw.hidden = !swatch; if (swatch) sw.style.background = css(swatch);
}
function setAction(icon, label, fn) { const a = $('act'); a.innerHTML = ICONS[icon]; a.setAttribute('aria-label', label); a.onclick = fn; }
const hintEl = $('hint'), toastEl = $('toast');
function hint(text) { hintEl.textContent = text || ''; hintEl.classList.toggle('hide', !text); }
function toast(msg, ms = 3000) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), ms);
}
function showSheet(build) { const card = $('card'); card.innerHTML = ''; build(card); $('sheet').hidden = false; }
function hideSheet() { $('sheet').hidden = true; }
const sheetOpen = () => !$('sheet').hidden;
function el(tag, props, kids) { const e = document.createElement(tag); Object.assign(e, props || {}); (kids || []).forEach(k => e.append(k)); return e; }
function buttons(list) {
  return el('div', { className: 'btns' }, list.map(([label, fn, primary]) => {
    const b = el('button', { className: 'btn' + (primary ? ' primary' : ''), textContent: label }); b.onclick = fn; return b;
  }));
}

/* ---------- sound ---------- */
let actx = null, soundOn = store.get('sound', true);
function audioUnlock() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }

function tone(f0, f1, dur, vol, type = 'sine') {

function blop(r, kind) {
  const f = clamp(9000 / (r + 4), 150, 1100) * (kind === 'split' ? 1.5 : 1);
  const vol = kind === 'spawn' ? .07 : kind === 'wall' ? .05 : .2;
  tone(f * .6, f * 1.3, .17, vol);
}
const sfx = {
  fall() { tone(520, 70, .6, .22); },
  sip() { tone(260, 200, .08, .04, 'triangle'); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f * 1.01, .22, .12, 'triangle'), i * 90)); },
  flick() { tone(300, 900, .12, .08, 'triangle'); },
  ring(v) { tone(400 + v * 60, 420 + v * 60, .25, .1, 'triangle'); },
  putt() { tone(700, 500, .07, .12, 'triangle'); },
  cue(p) { tone(900, 700, .05, .06 + p * .1, 'square'); },
  click(v) { const now = performance.now(); if (now - (sfx.lastClick || 0) < 30) return; sfx.lastClick = now; tone(2200, 1900, .04, clamp(v / 4000, .02, .12), 'triangle'); },
  boing() { tone(300, 620, .18, .1, 'triangle'); },
  cup() { [330, 247].forEach((f, i) => setTimeout(() => tone(f, f * .9, .12, .14, 'triangle'), i * 70)); },
};

/* ---------- blobs ---------- */
function makeBlob(x, y, r, c) {
  return { id: nextId++, x, y, vx: 0, vy: 0, r, tr: r, col: c.slice(), tcol: c.slice(),

function poke(b, ang, amt) {

  updateHud() { hud(`Hole ${this.idx + 1} · Par ${HOLES[this.idx].par}`, `${this.strokes} stroke${this.strokes === 1 ? '' : 's'}`, null); },
  tray() {

  renderLayer() {

  down(p) { if (this.status === 'aim') aimDown(p, this.ball); },

  up(p) {

  draw() {

/* ======================================================================
   PAINT POOL — sink every ball; each pocket mixes what falls in
   ====================================================================== */
const POOL_COLORS = [[.84, .12, .17], [.98, .84, .14], [.10, .23, .75], [.95, .5, .1], [.15, .55, .25], [.45, .2, .6], [.95, .55, .7], [.1, .55, .55], [.45, .27, .12], [.11, .11, .13]];
const pool = {
  key: 'pool', name: 'Paint Pool', blurb: 'Sink ten balls; pockets mix colors.',
  enter() {
    this.newGame();

    hint('Touch the white ball and flick it into the rack. Don’t sink the white!');
  },
  geometry() {

    this.head = [W / 2, H * .74];
  },
  newGame() {

    blobs = []; this.shots = 0; this.sunk = 0; this.status = 'aim'; aim.id = null; this.scratch = false;
    const r = this.br, ax = W / 2, ay = H * .34, gap = r * 2.04;
    let i = 0;
    for (let row = 0; row < 4; row++) for (let j = 0; j <= row; j++) {
      const b = makeBlob(ax + (j - row / 2) * gap, ay - row * gap * .87, r, POOL_COLORS[i++]); blobs.push(b);
    }
    this.cue = makeBlob(this.head[0], this.head[1], r, PAINTS[3].c); this.cue.isCue = true; blobs.push(this.cue);
    const [sc, sg] = layer(); this.stain = sc; this.sg = sg;
    this.renderLayer(); hideSheet(); this.tray(); this.updateHud();
  },
  updateHud() { hud(`Sunk ${this.sunk} of 10`, `${this.shots} shot${this.shots === 1 ? '' : 's'}`, null); },
  tray() {
    const tray = $('tray'); tray.innerHTML = '';
    const row = el('div', { className: 'queue' });
    for (const p of this.pockets) { const d = el('i', { className: p.col ? '' : 'used' }); d.style.background = p.col ? css(p.col) : 'var(--rim)'; row.append(d); }
    const best = store.get('poolBest', null);
    const names = this.pockets.filter(p => p.col).map(p => nameColor(p.col));
    tray.append(row, el('div', { className: 'traynote', textContent: names.length ? `Pockets: ${[...new Set(names)].slice(0, 3).join(', ')}` : (best != null ? `Best: ${best} shots` : 'Six pockets, six paint pots') }));
  },
  renderLayer() {
    const [lc, g] = layer(); this.layer = lc;
    const m = this.m;
    // rails
    g.fillStyle = '#3A3B45';
    g.beginPath(); g.rect(0, 0, W, H); g.rect(m, m, W - 2 * m, H - 2 * m); g.fill('evenodd');
    g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 2; g.strokeRect(m - 1, m - 1, W - 2 * m + 2, H - 2 * m + 2);
    g.fillStyle = 'rgba(241,242,236,.5)';
    for (const f of [.25, .5, .75]) { for (const [x, y] of [[f * W, m / 2], [f * W, H - m / 2], [m / 2, f * H], [W - m / 2, f * H]]) { if (f === .5 && x < W * .1 || f === .5 && x > W * .9) continue; g.beginPath(); g.arc(x, y, 2, 0, TAU); g.fill(); } }

    g.strokeStyle = 'rgba(36,37,44,.16)'; g.setLineDash([5, 6]); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(m, this.head[1]); g.lineTo(W - m, this.head[1]); g.stroke(); g.setLineDash([]);
    g.fillStyle = 'rgba(36,37,44,.25)'; g.beginPath(); g.arc(W / 2, H * .34, 2.5, 0, TAU); g.fill();
  },
  down(p) { if (this.status === 'aim' && this.cue && !this.cue.gone) aimDown(p, this.cue); },
  move(p) { aimMove(p); },
  up(p) {
    const a = aimUp(p, this.U * 7); if (!a || this.status !== 'aim') return;

  nearPocket(b) { return this.pockets.some(p => Math.hypot(p.x - b.x, p.y - b.y) < p.r * 1.45); },

/* ======================================================================

   knock them into the matching circle

const GLAZE = { name: 'Glaze', c: [.93, .94, .9], glaze: true };

    const U = Math.min(W, H); this.U = U;
    this.br = U * .034; this.r0 = U * .062; this.cr = U * (this.level > 4 ? .12 : .13);
    this.launchY = H * .8; this.spot = [W / 2, H - Math.max(this.br * 2.6, (H - this.launchY) * .5)];
  },
  build() {
    this.geometry();
    const L = this.level, R = rng(L * 104729 + 7), U = this.U;
    const n = L === 1 ? 1 : L <= 3 ? 2 : L <= 6 ? 3 : 4;
    const maxHits = Math.min(4, 1 + Math.ceil(L / 2));
    const pick = a => a[Math.floor(R() * a.length)];
    const goals = [];
    // targets are made by really mixing shots into the start colour, so every one is reachable
    for (let i = 0; i < n; i++) {
      for (let tries = 0; tries < 40; tries++) {
        const start = pick([0, 1, 2, 3]);
        let col = PAINTS[start].c.slice(), A = this.r0 * this.r0;
        const hits = 1 + Math.floor(R() * maxHits), recipe = [];
        for (let k = 0; k < hits; k++) {
          const s = R() < .12 ? 4 : pick([0, 1, 2, 3].filter(j => j !== start || k > 0));
          col = mixPaint(col, A, PAINTS[s].c, this.br * this.br); A += this.br * this.br; recipe.push(s);
        }
        if (deltaE(col, PAINTS[start].c) < 26) continue;
        if (goals.some(g => deltaE(g.target, col) < 22)) continue;
        goals.push({ start, target: col, hits, recipe });
        break;
      }
    }
    // place circles up top and starting blobs between them and the launch line
    const placed = [], free = (x, y, r) => placed.every(([px, py, pr]) => Math.hypot(px - x, py - y) > pr + r + U * .04);
    const spotIn = (y0, y1, r) => {
      for (let t = 0; t < 200; t++) { const x = r + U * .03 + R() * (W - 2 * (r + U * .03)), y = y0 + R() * (y1 - y0); if (free(x, y, r)) return [x, y]; }
      return [W / 2, (y0 + y1) / 2];
    };
    this.goals = goals.map(g => { const [x, y] = spotIn(H * .06 + this.cr, H * .48, this.cr); placed.push([x, y, this.cr]); return { ...g, x, y }; });
    for (const g of this.goals) { const [x, y] = spotIn(H * .42, this.launchY - this.r0 * 2.2, this.r0 * 1.4); placed.push([x, y, this.r0 * 1.4]); g.bx = x; g.by = y; }
    this.par = goals.reduce((a, g) => a + g.hits, 0) + goals.length;
    this.reset();
  },
  reset() {
    blobs = []; this.shots = 0; this.status = 'aim'; this.solved = false;
    for (const g of this.goals) { const b = makeBlob(g.bx, g.by, this.r0, PAINTS[g.start].c); b.r = 1; b.goalBlob = true; blobs.push(b); }
    const [sc, sg] = layer(); this.stain = sc; this.sg = sg;
    this.renderLayer(); this.spawn(); hideSheet(); this.tray(); this.updateHud();
  },
  spawn() {
    const p = MATCH_PAINTS[this.sel];
    const b = makeBlob(this.spot[0], this.spot[1], this.br, p.c);
    b.ready = true; b.shot = true; b.glaze = !!p.glaze; if (b.glaze) b.alpha = .6; b.r = 1;
    blobs.push(b); this.ready = b; this.status = 'aim';
  },
  setPaint(i) {
    this.sel = i; this.tray();
    const b = this.ready;
    if (b && !b.holders.length) { const p = MATCH_PAINTS[i]; b.col = p.c.slice(); b.tcol = p.c.slice(); b.glaze = !!p.glaze; b.alpha = b.glaze ? .6 : null; poke(b, -Math.PI / 2, 1); }
  },
  tray() {
    const tray = $('tray'); tray.innerHTML = '';
    const wells = el('div', { className: 'wells' });
    MATCH_PAINTS.forEach((p, i) => {
      const b = el('button', { className: 'well' + (p.glaze ? ' glaze' : '') });
      b.style.background = p.glaze ? 'repeating-linear-gradient(45deg,#F4F4EF 0 5px,#DCDDD5 5px 10px)' : css(p.c);
      b.setAttribute('aria-label', p.name); b.setAttribute('aria-pressed', i === this.sel);
      b.onclick = () => this.setPaint(i);
      wells.append(b);
    });
    tray.append(wells, el('div', { className: 'traynote', textContent: `${MATCH_PAINTS[this.sel].name} · Level ${this.level} · Par ${this.par}` }));
  },
  matched() { // pair resting blobs with circles: right colour, centre well inside
    const used = new Set(), res = [];
    for (const g of this.goals) {
      const b = blobs.find(o => o.goalBlob && !o.gone && !used.has(o) && Math.hypot(o.x - g.x, o.y - g.y) < Math.max(this.cr - o.r * .5, this.cr * .45) && deltaE(o.tcol, g.target) < MATCH_OK);
      if (b) used.add(b);
      res.push(!!b);
    }
    return res;
  },
  updateHud() {
    const m = this.matched(), k = m.filter(Boolean).length;
    hud(`Matched ${k} of ${this.goals.length}`, `${this.shots} shot${this.shots === 1 ? '' : 's'}`, null);
  },
  renderLayer() {
    const [lc, g] = layer(); this.layer = lc;
    g.strokeStyle = 'rgba(36,37,44,.22)'; g.setLineDash([6, 6]); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(14, this.launchY); g.lineTo(W - 14, this.launchY); g.stroke(); g.setLineDash([]);
  },
  closest(b) { return Math.min(...this.goals.map(g => deltaE(b.tcol, g.target))); },
  down(p) {
    const b = this.ready;
    if (!b || this.status !== 'aim' || b.holders.length) return;
    if (Math.hypot(p.x - b.x, p.y - b.y) > Math.max(44, b.r * 3)) return;
    p.blob = b; p.ox = p.x - b.x; p.oy = p.y - b.y; b.holders = [p.id];
    p.trail = [[performance.now(), p.x, p.y]];
    hint('');
  },
  move(p) { flick.move(p); },
  up(p) {
    const b = p.blob; if (!b || b !== this.ready) return;
    b.holders = [];
    const tr = p.trail || []; tr.push([performance.now(), p.x, p.y]);
    const a = tr[0], z = tr[tr.length - 1], dt = (z[0] - a[0]) / 1000;
    let vx = dt > .008 ? (z[1] - a[1]) / dt : 0, vy = dt > .008 ? (z[2] - a[2]) / dt : 0;
    const sp = Math.hypot(vx, vy);
    if (sp < 160 || vy > -60) return; // not a flick: it slides back to the spot
    const cap = this.U * 8; if (sp > cap) { vx *= cap / sp; vy *= cap / sp; }
    b.vx = vx; b.vy = vy; b.ready = false; this.ready = null;
    this.shots++; this.status = 'rolling'; sfx.flick(); this.updateHud();
  },
  hit(blob, shot) {
    const before = this.closest(blob);
    if (shot.glaze) { // glaze pushes without tinting
      const As = blob.tr * blob.tr, Ao = shot.tr * shot.tr;
      blob.vx = (blob.vx * As + shot.vx * Ao) / (As + Ao); blob.vy = (blob.vy * As + shot.vy * Ao) / (As + Ao);
      shot.gone = { t: 0, into: blob, r0: shot.r }; poke(blob, Math.atan2(shot.y - blob.y, shot.x - blob.x), 1.4); blop(blob.tr, 'merge');
    } else absorb(blob, shot);
    blob.count = 1;
    this.sg.fillStyle = css(shot.tcol, .18); this.sg.beginPath(); this.sg.arc(blob.x, blob.y, blob.tr * 1.4, 0, TAU); this.sg.fill();
    if (!shot.glaze) {
      const after = this.closest(blob);
      toast(after < MATCH_OK ? `${nameColor(blob.tcol)}: that’s a match!` : after < before - 1 ? `${nameColor(blob.tcol)}: closer!` : `${nameColor(blob.tcol)}: further off`, 1300);
    }
  },
  step(dt) {
    let moving = false;
    for (const b of [...blobs]) {
      if (!settle(b, dt)) continue;
      const hs = holdersOf(b);
      if (b.ready) {
        if (hs.length) { followPointers(b, hs, dt); b.y = Math.max(b.y, this.launchY + b.r); }
        else { const k = 1 - Math.exp(-dt * 10); b.x += (this.spot[0] - b.x) * k; b.y += (this.spot[1] - b.y) * k; b.vx = b.vy = 0; }
        boardWalls(b); continue;
      }
      const was = Math.hypot(b.vx, b.vy) > 0;
      if (roll(b, dt, b.shot ? 1.3 : 1.6, b.shot ? 160 : 190)) { moving = true; if (Math.hypot(b.vx, b.vy) > 50) streak(this.sg, b, b.glaze ? .03 : .05); }
      else if (was && b.shot) b.gone = { t: 0, r0: b.r, x: b.x, y: b.y, dur: .5 }; // a miss dries up
      boardWalls(b, .55);
    }
    const L = blobs.filter(b => !b.gone && !b.ready);
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      const a = L[i], b = L[j]; if (a.gone || b.gone) continue;
      if (a.shot && b.shot) continue;
      if (a.shot || b.shot) {
        const shot = a.shot ? a : b, blob = shot === a ? b : a;
        if (Math.hypot(a.x - b.x, a.y - b.y) < (a.r + b.r) * .85) this.hit(blob, shot);
      } else bounceBalls(a, b, .8);
    }
    if (blobs.some(b => b.gone && b.gone.t < 1)) moving = true;
    blobs = blobs.filter(b => !b.gone || b.gone.t < 1);
    this.updateHud();
    if (this.status === 'rolling' && !moving) {
      if (this.matched().every(Boolean)) this.win();
      else this.spawn();
    }
  },
  win() {
    this.status = 'done'; sfx.win();
    const stars = this.shots <= this.par ? 3 : this.shots <= this.par + 3 ? 2 : 1;
    const all = store.get('matchStars', {}); all[this.level] = Math.max(all[this.level] || 0, stars); store.set('matchStars', all);
    store.set('matchLevel', this.level + 1);
    setTimeout(() => showSheet(card => {
      card.append(el('h2', { textContent: `Level ${this.level} matched!` }));
      card.append(el('div', { className: 'stars' }, [0, 1, 2].map(i => el('span', { className: i < stars ? 'on' : '' }))));
      card.append(el('p', { textContent: `${this.shots} shots (par ${this.par}). You mixed ${this.goals.map(g => nameColor(g.target).toLowerCase()).join(', ')}.` }));
      card.append(buttons([['Replay', () => { store.set('matchLevel', this.level); this.reset(); }], ['Next level', () => { this.level++; this.build(); }, true]]));
    }), 400);
  },
  draw() {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (this.stain) ctx.drawImage(this.stain, 0, 0);
    if (this.layer) ctx.drawImage(this.layer, 0, 0);
    ctx.restore();
    const m = this.matched();
    this.goals.forEach((g, i) => {
      ctx.fillStyle = css(g.target, m[i] ? .3 : .16); ctx.beginPath(); ctx.arc(g.x, g.y, this.cr, 0, TAU); ctx.fill();
      ctx.fillStyle = css(g.target); ctx.beginPath(); ctx.arc(g.x, g.y, this.cr * .24, 0, TAU); ctx.fill(); // the colour to match, as a solid chip
      ctx.strokeStyle = css(g.target); ctx.lineWidth = m[i] ? 6 : 4; ctx.setLineDash(m[i] ? [] : [10, 7]);
      ctx.beginPath(); ctx.arc(g.x, g.y, this.cr, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      if (m[i]) { // check mark on the rim
        const x = g.x + this.cr * .72, y = g.y - this.cr * .72;
        ctx.fillStyle = css(g.target); ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill();
        ctx.strokeStyle = lab(g.target)[0] > 60 ? '#24252C' : '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x - 1, y + 4); ctx.lineTo(x + 5, y - 4); ctx.stroke();
      }
    });
    for (const b of blobs) if (b.gone) drawBlob(b);
    for (const b of blobs) if (!b.gone) drawBlob(b);
    const b = this.ready;
    if (b && b.holders.length) {
      ctx.strokeStyle = 'rgba(36,37,44,.3)'; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.1, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
  },
  resize(ow, oh) {
    for (const b of blobs) { b.x *= W / ow; b.y *= H / oh; }
    for (const g of this.goals) { g.x *= W / ow; g.y *= H / oh; g.bx *= W / ow; g.by *= H / oh; }
    this.geometry(); this.renderLayer();
    const [sc, sg] = layer(); this.stain = sc; this.sg = sg;
  },
};

/* ---------- modes ---------- */
const MODES = { studio, match, maze, flick, golf, pool };
if (location.hostname === 'localhost') window.__gloop = { MODES, get blobs() { return blobs; } }; // local testing only
let mode = studio;
function setMode(key, data) {
  for (const b of blobs) b.holders = [];
  for (const p of pointers.values()) p.blob = null;
  aim.id = null;
  hideSheet();
  mode = MODES[key] || studio; store.set('mode', mode.key);
  $('modeName').textContent = mode.name;
  if (tiltOn) tiltBase = null; // recalibrate "level" for the new game
  mode.enter(data);
}
function drawPickIcon(canvas, key) {
  const s = 112; canvas.width = canvas.height = s; const g = canvas.getContext('2d');
  g.fillStyle = '#F1F2EC'; g.fillRect(0, 0, s, s);
  const dot = (x, y, r, c) => { g.fillStyle = css(c); g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(x - r * .35, y - r * .4, r * .35, 0, TAU); g.fill(); };
  if (key === 'studio') { dot(40, 46, 22, PAINTS[0].c); dot(72, 52, 20, PAINTS[1].c); dot(56, 78, 20, PAINTS[2].c); }
  if (key === 'maze') {
    g.strokeStyle = '#3A3B45'; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(14, 14); g.lineTo(98, 14); g.lineTo(98, 98); g.lineTo(14, 98); g.closePath();
    g.moveTo(42, 14); g.lineTo(42, 70); g.moveTo(70, 42); g.lineTo(70, 98); g.stroke();
    g.fillStyle = '#1A1A20'; g.beginPath(); g.arc(84, 30, 9, 0, TAU); g.fill();
    dot(28, 82, 10, PAINTS[2].c);
  }
  if (key === 'flick') {
    [[44, '#E3E4DC'], [30, '#F4F4EF'], [16, '#C9A24A']].forEach(([r, c]) => { g.fillStyle = c; g.beginPath(); g.arc(56, 44, r, 0, TAU); g.fill(); g.strokeStyle = 'rgba(36,37,44,.3)'; g.lineWidth = 2; g.stroke(); });
    dot(56, 96, 9, PAINTS[0].c);
  }
  if (key === 'golf') {
    g.fillStyle = '#9A9DA4'; g.beginPath(); g.arc(64, 70, 13, 0, TAU); g.fill();
    g.fillStyle = '#15161B'; g.beginPath(); g.arc(64, 70, 10, 0, TAU); g.fill();
    g.strokeStyle = '#24252C'; g.lineWidth = 3; g.beginPath(); g.moveTo(64, 70); g.lineTo(64, 22); g.stroke();
    g.fillStyle = '#C2412F'; g.beginPath(); g.moveTo(64, 22); g.lineTo(88, 30); g.lineTo(64, 38); g.closePath(); g.fill();
    dot(30, 92, 9, PAINTS[1].c);
  }
  if (key === 'match') {
    const t = mixPaint(PAINTS[1].c, 1, PAINTS[2].c, 1);
    g.fillStyle = css(t, .2); g.beginPath(); g.arc(68, 40, 26, 0, TAU); g.fill();
    g.strokeStyle = css(t); g.lineWidth = 5; g.setLineDash([9, 6]); g.stroke(); g.setLineDash([]);
    dot(40, 80, 15, PAINTS[1].c); dot(78, 98, 7, PAINTS[2].c);
  }
  if (key === 'pool') {
    g.fillStyle = '#3A3B45'; g.fillRect(0, 0, s, 10); g.fillRect(0, s - 10, s, 10); g.fillRect(0, 0, 10, s); g.fillRect(s - 10, 0, 10, s);
    const r = 9; let i = 0;
    for (let row = 0; row < 3; row++) for (let j = 0; j <= row; j++) dot(56 + (j - row / 2) * r * 2.1, 52 - row * r * 1.85, r, POOL_COLORS[i++]);
    dot(56, 88, r, PAINTS[3].c);
  }
}
function openMenu() {
  showSheet(card => {
    card.append(el('h2', { textContent: 'Play with paint' }));
    const grid = el('div', { className: 'picks' }); card.append(grid);
    for (const m of Object.values(MODES)) {
      const icon = el('canvas'); drawPickIcon(icon, m.key);
      const b = el('button', { className: 'pick' }, [icon, el('span', {}, [el('b', { textContent: m.name }), el('span', { textContent: m.blurb })])]);
      if (m === mode) b.setAttribute('aria-current', 'true');
      b.onclick = () => {
        audioUnlock();
        if (m.key === 'maze' && !tiltOn) enableTilt(true); // ask for motion while we still have the tap
        setMode(m.key);
      };
      grid.append(b);
    }
    card.append(buttons([['Keep playing', hideSheet]]));
  });
}
$('modeBtn').addEventListener('click', openMenu);
$('sheet').addEventListener('pointerdown', e => { if (e.target === $('sheet')) hideSheet(); });

/* ---------- input ---------- */
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioUnlock();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = local(e);
  const p = { id: e.pointerId, x, y, blob: null, ox: 0, oy: 0 };
  pointers.set(e.pointerId, p);
  mode.down(p);
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  [p.x, p.y] = local(e);
  mode.move && mode.move(p);
});
function endPointer(e) {
  const p = pointers.get(e.pointerId); if (!p) return;
  pointers.delete(e.pointerId);
  if (e.type === 'pointercancel' && aim.id === p.id) aim.id = null;
  mode.up(p);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
document.addEventListener('touchmove', e => { if (!e.target.closest('.sheet')) e.preventDefault(); }, { passive: false }); // no page bounce, but menus still scroll
document.addEventListener('gesturestart', e => e.preventDefault());
const sndBtn = $('snd');
sndBtn.setAttribute('aria-pressed', soundOn);
sndBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); sndBtn.setAttribute('aria-pressed', soundOn); if (soundOn) audioUnlock(); });

/* ---------- loop & sizing ---------- */
function makeBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const g = bg.getContext('2d');
  g.fillStyle = '#F1F2EC'; g.fillRect(0, 0, bg.width, bg.height);
  const n = (bg.width * bg.height) / 55; // primed-canvas tooth: fine speckle plus a faint weave
  for (let i = 0; i < n; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(40,42,50,.05)' : 'rgba(255,255,255,.5)'; g.fillRect(Math.random() * bg.width, Math.random() * bg.height, DPR, DPR); }
  g.strokeStyle = 'rgba(40,42,50,.025)'; g.lineWidth = DPR;
  for (let x = 0; x < bg.width; x += 4 * DPR) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, bg.height); g.stroke(); }
  for (let y = 0; y < bg.height; y += 4 * DPR) { g.beginPath(); g.moveTo(0, y); g.lineTo(bg.width, y); g.stroke(); }
}
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
  makeBg();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bg) ctx.drawImage(bg, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mode.draw();
}
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(.05, (t - (last || t)) / 1000); last = t; acc += dt;
  while (acc >= STEP) { if (!sheetOpen() || mode === studio) mode.step(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

window.claude?.hot?.snapshot?.(() => ({ mode: mode.key, studio: mode === studio ? studio.snapshot() : null }));
function start(data) {
  data = data || {};
  resize();
  let ready = false;
  const boot = () => { ready = true; setMode(data.mode || store.get('mode', 'studio'), data.studio); };
  new ResizeObserver(() => {
    const ow = W, oh = H; resize();
    if (W <= 0 || H <= 0) return;
    if (!ready) boot();
    else if (ow && oh && (ow !== W || oh !== H)) mode.resize(ow, oh);
  }).observe(cv);
  if (W > 0 && H > 0 && !ready) boot();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
