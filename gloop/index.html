<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gloop">
<meta name="theme-color" content="#E8E9E3">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Gloop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* Layout: one-screen app — slim header, a framed gesso "palette slab" filling the screen, paint wells along the bottom. Deliberately single (light) theme: paint reads on primed canvas. */
:root{
  --gesso:#E8E9E3;
  --slab:#F1F2EC;
  --ink:#24252C;
  --muted:#6A6C73;
  --rim:rgba(36,37,44,.14);
  --well-shadow:rgba(20,20,30,.22);
  --font-ui:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--gesso); color:var(--ink); font-family:var(--font-ui);
  overflow:hidden; touch-action:none; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.app{height:100%; display:flex; flex-direction:column; padding-inline:16px; box-sizing:border-box}
.top{display:flex; align-items:center; gap:12px; padding-block:10px}
.mark{font-weight:800; font-size:22px; letter-spacing:-.02em; font-variation-settings:"opsz" 96}
.mix{flex:1; min-width:0; display:flex; align-items:center; gap:8px; justify-content:center}
.mix .sw{width:22px; height:22px; border-radius:50%; background:var(--slab); box-shadow:inset 0 0 0 1px var(--rim); flex:none; transition:background .3s}
.mix .txt{display:flex; flex-direction:column; line-height:1.1; min-width:0}
.mix small{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.mix b{font-weight:500; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tools{display:flex; gap:4px}
.icon{width:40px; height:40px; border:0; border-radius:12px; background:transparent; color:var(--ink); display:grid; place-items:center; cursor:pointer}
.icon:active{background:var(--rim)}
.icon:focus-visible,.well:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.icon svg{width:22px; height:22px}
#tilt[aria-pressed="true"]{background:var(--ink); color:var(--slab)}
.toast{position:absolute; left:50%; top:14px; transform:translateX(-50%); max-width:calc(100% - 32px); box-sizing:border-box; padding:8px 14px; border-radius:12px; background:var(--ink); color:var(--slab); font-size:13px; line-height:1.35; text-align:center; pointer-events:none; opacity:0; transition:opacity .3s}
.toast.show{opacity:1}
.icon[aria-pressed="false"] .on{display:none}
.icon[aria-pressed="true"] .off{display:none}
.board{flex:1; min-height:0; position:relative; border-radius:20px; overflow:hidden; background:var(--slab); box-shadow:inset 0 0 0 1px var(--rim)}
canvas{display:block; width:100%; height:100%; touch-action:none}
.hint{position:absolute; left:0; right:0; bottom:18px; margin:0; text-align:center; font-size:13px; line-height:1.5; color:var(--muted); pointer-events:none; transition:opacity .6s; padding-inline:16px}
.hint.hide{opacity:0}
.tray{display:flex; flex-direction:column; align-items:center; gap:6px; padding-block:12px 8px}
.wells{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
.well{width:46px; height:46px; border-radius:50%; border:0; cursor:pointer; padding:0;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.16), inset 0 3px 4px rgba(255,255,255,.35), 0 2px 5px var(--well-shadow);
  transition:transform .15s}
.well[aria-pressed="true"]{transform:translateY(-4px); outline:3px solid var(--ink); outline-offset:3px}
.paintname{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .well,.hint,.mix .sw{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="mark">Gloop</div>
    <div class="mix" aria-live="polite">
      <span class="sw" id="mixSw"></span>
      <span class="txt"><small>Last mix</small><b id="mixName">Nothing yet</b></span>
    </div>
    <div class="tools">
      <button class="icon" id="tilt" aria-pressed="false" aria-label="Tilt to move paint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="9" height="16" rx="2" transform="rotate(15 12.5 11)"/><path d="M3 15a9 9 0 0 0 4 5M21 9a9 9 0 0 0-4-5"/></svg>
      </button>
      <button class="icon" id="snd" aria-pressed="true" aria-label="Sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon" id="clr" aria-label="Clear the board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>
  </header>
  <div class="board">
    <canvas id="board"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <p class="hint" id="hint">Touch and hold to squeeze out paint. Fling blobs into each other to mix.<br>Grab one with two fingers and pull to split it.</p>
  </div>
  <nav class="tray" aria-label="Paints">
    <div class="wells" id="wells"></div>
    <div class="paintname" id="paintName"></div>
  </nav>
</div>

<script>
(() => {
const TAU = Math.PI * 2, N = 28, MIN_R = 16, MAX_R = 62, MAX_BLOBS = 48, STEP = 1 / 120;
const PAINTS = [
  { name: 'Cadmium Red',    c: [0.84, 0.12, 0.17] },
  { name: 'Lemon Yellow',   c: [0.98, 0.84, 0.14] },
  { name: 'Ultramarine',    c: [0.10, 0.23, 0.75] },
  { name: 'Titanium White', c: [0.97, 0.97, 0.95] },
  { name: 'Ivory Black',    c: [0.11, 0.11, 0.13] },
];
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
const hintEl = document.getElementById('hint');
let W = 0, H = 0, DPR = 1, bg = null;
let blobs = [], sel = 0, nextId = 1, seeded = false;
const pointers = new Map();

/* ---------- colour ---------- */
const css = c => `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
// Subtractive-ish mix: area-weighted geometric mean per channel (blue + yellow → green), then a small chroma lift.
function mixPaint(c1, a1, c2, a2) {
  const w = a1 / (a1 + a2);
  const out = [0, 1, 2].map(i => Math.exp(w * Math.log(Math.max(.02, c1[i])) + (1 - w) * Math.log(Math.max(.02, c2[i]))));
  const m = (out[0] + out[1] + out[2]) / 3;
  return out.map(v => Math.min(1, Math.max(0, m + (v - m) * 1.12)));
}
function hsl([r, g, b]) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}
const HUES = [[12,'Red'],[24,'Vermilion'],[40,'Orange'],[52,'Amber'],[66,'Yellow'],[90,'Chartreuse'],[155,'Green'],[180,'Teal'],[205,'Cerulean'],[240,'Blue'],[265,'Indigo'],[292,'Violet'],[325,'Magenta'],[348,'Rose'],[361,'Red']];
function nameColor(c) {
  const [h, s, l] = hsl(c);
  if (s < .12 || l < .06) return l < .2 ? 'Charcoal' : l < .4 ? 'Slate' : l < .65 ? 'Grey' : l < .85 ? 'Silver' : 'Chalk';
  let base = HUES.find(([lim]) => h < lim)[1];
  if (l < .38 && h >= 15 && h < 50) base = 'Brown';
  else if (l < .42 && h >= 50 && h < 80) base = 'Olive';
  else if (l > .72 && (h < 15 || h >= 330)) base = 'Pink';
  const mod = l < .22 ? 'Deep ' : l > .78 ? 'Pale ' : s < .3 ? 'Dusty ' : s < .5 && l < .45 ? 'Muddy ' : '';
  return mod + base;
}
function showMix(c) {
  document.getElementById('mixSw').style.background = css(c);
  document.getElementById('mixName').textContent = nameColor(c);
}

/* ---------- sound ---------- */
let actx = null, soundOn = true;
function audioUnlock() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
function blop(r, kind) {
  if (!soundOn || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  const f = Math.max(150, Math.min(1100, 9000 / (r + 4))) * (kind === 'split' ? 1.5 : 1);
  const vol = kind === 'spawn' ? .07 : kind === 'wall' ? .05 : .2;
  o.type = 'sine';
  o.frequency.setValueAtTime(f * .6, t);
  o.frequency.exponentialRampToValueAtTime(f * 1.3, t + .08);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + .17);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + .2);
}

/* ---------- blobs ---------- */
function makeBlob(x, y, r, c) {
  return { id: nextId++, x, y, vx: 0, vy: 0, r, tr: r, col: c.slice(), tcol: c.slice(),
    o: new Float32Array(N), ov: new Float32Array(N), holders: [], age: 0, growing: false,
    gone: null, ax: 0, as: 1 };
}
function poke(b, ang, amt) {
  for (let i = 0; i < N; i++) {
    const d = Math.atan2(Math.sin(i / N * TAU - ang), Math.cos(i / N * TAU - ang));
    b.ov[i] += amt * (Math.exp(-d * d * 2.5) - .25);
  }
}
const live = () => blobs.filter(b => !b.gone);
function blobAt(x, y) {
  for (let i = blobs.length - 1; i >= 0; i--) {
    const b = blobs[i];
    if (!b.gone && Math.hypot(x - b.x, y - b.y) < b.r * 1.15 + 6) return b;
  }
  return null;
}
function releaseHolders(b) {
  for (const id of b.holders) { const p = pointers.get(id); if (p) p.blob = null; }
  b.holders = [];
}
function merge(a, b) {
  let s, o;
  if (a.holders.length && !b.holders.length) { s = a; o = b; }
  else if (b.holders.length && !a.holders.length) { s = b; o = a; }
  else { s = a.tr >= b.tr ? a : b; o = s === a ? b : a; }
  const As = s.tr * s.tr, Ao = o.tr * o.tr;
  s.tcol = mixPaint(s.tcol, As, o.tcol, Ao);
  s.tr = Math.sqrt(As + Ao);
  if (!s.holders.length) { s.vx = (s.vx * As + o.vx * Ao) / (As + Ao); s.vy = (s.vy * As + o.vy * Ao) / (As + Ao); }
  releaseHolders(o);
  o.gone = { t: 0, into: s, r0: o.r };
  poke(s, Math.atan2(o.y - s.y, o.x - s.x), 1.6);
  blop(s.tr, 'merge');
  showMix(s.tcol);
}
function split(b, p1, p2) {
  const r = b.tr / Math.SQRT2;
  const nb = makeBlob(p2.x, p2.y, r, b.col);
  nb.tcol = b.tcol.slice();
  b.tr = b.r = r; b.x = p1.x; b.y = p1.y; b.as = 1; b.vx = b.vy = 0;
  b.holders = [p1.id]; p1.blob = b; p1.ox = p1.oy = 0;
  nb.holders = [p2.id]; p2.blob = nb; p2.ox = p2.oy = 0;
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  poke(b, ang, 1.4); poke(nb, ang + Math.PI, 1.4);
  blobs.push(nb);
  blop(r, 'split');
}
function clearBoard() {
  for (const b of blobs) if (!b.gone) { releaseHolders(b); b.gone = { t: 0, into: null, r0: b.r }; }
  hintEl.classList.remove('hide');
}
function seed() {
  const s = Math.min(W, H);
  const add = (fx, fy, r, i) => { const b = makeBlob(W * fx, H * fy, s * r, PAINTS[i].c); blobs.push(b); };
  add(.28, .3, .1, 0); add(.72, .36, .11, 1); add(.48, .62, .105, 2);
}

/* ---------- input ---------- */
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioUnlock();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = local(e);
  const p = { id: e.pointerId, x, y, blob: null, ox: 0, oy: 0 };
  const b = blobAt(x, y);
  if (b) {
    if (b.holders.length < 2) {
      p.blob = b; p.ox = x - b.x; p.oy = y - b.y;
      b.holders.push(p.id); b.growing = false;
      poke(b, Math.atan2(y - b.y, x - b.x), -.8);
    }
  } else if (live().length < MAX_BLOBS) {
    const nb = makeBlob(x, y, MIN_R * .5, PAINTS[sel].c);
    nb.tr = MIN_R; nb.growing = true; nb.holders.push(p.id);
    blobs.push(nb); p.blob = nb;
    blop(MAX_R, 'spawn');
  }
  pointers.set(e.pointerId, p);
  hintEl.classList.add('hide');
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  [p.x, p.y] = local(e);
});
function endPointer(e) {
  const p = pointers.get(e.pointerId); if (!p) return;
  const b = p.blob;
  pointers.delete(e.pointerId);
  if (!b) return;
  b.holders = b.holders.filter(id => id !== p.id);
  if (!b.holders.length) b.growing = false;
  else { const q = pointers.get(b.holders[0]); if (q) { q.ox = q.x - b.x; q.oy = q.y - b.y; } }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- simulation ---------- */
function step(dt) {
  for (const b of blobs) {
    b.age += dt;
    if (b.gone) {
      const g = b.gone; g.t += dt / .22;
      if (g.into) { const k = 1 - Math.exp(-dt * 20); b.x += (g.into.x - b.x) * k; b.y += (g.into.y - b.y) * k; }
      b.r = g.r0 * Math.max(0, 1 - g.t * g.t);
      continue;
    }
    const hs = b.holders.map(id => pointers.get(id)).filter(Boolean);
    let tx, ty;
    if (hs.length === 1) { tx = hs[0].x - hs[0].ox; ty = hs[0].y - hs[0].oy; }
    else if (hs.length === 2) { tx = (hs[0].x + hs[1].x) / 2; ty = (hs[0].y + hs[1].y) / 2; }
    if (hs.length) {
      const k = 1 - Math.exp(-dt * 35);
      const nx = b.x + (tx - b.x) * k, ny = b.y + (ty - b.y) * k;
      b.vx += ((nx - b.x) / dt - b.vx) * .25; b.vy += ((ny - b.y) / dt - b.vy) * .25;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 2600) { b.vx *= 2600 / sp; b.vy *= 2600 / sp; }
      b.x = nx; b.y = ny;
    } else {
      if (tiltOn) { b.vx += grav.x * GRAVITY * dt; b.vy += grav.y * GRAVITY * dt; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      const f = Math.exp(-dt * 1.4); b.vx *= f; b.vy *= f;
    }
    // stretch: pulled between two fingers, or smeared along its velocity
    let targetAs;
    if (hs.length === 2) {
      const d = Math.hypot(hs[1].x - hs[0].x, hs[1].y - hs[0].y);
      b.ax = Math.atan2(hs[1].y - hs[0].y, hs[1].x - hs[0].x);
      targetAs = Math.max(1, .55 + d / (2 * b.r));
      if (d > 2.6 * b.r && b.tr > MIN_R * 1.3) { split(b, hs[0], hs[1]); continue; }
    } else {
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 30) b.ax = Math.atan2(b.vy, b.vx);
      targetAs = 1 + Math.min(.35, sp / 2200);
    }
    b.as += (targetAs - b.as) * Math.min(1, dt * 12);
    if (b.growing) {
      if (hs.length && b.age < 1.3) b.tr = Math.max(b.tr, MIN_R + (MAX_R - MIN_R) * Math.pow(b.age / 1.3, 1.4));
      else b.growing = false;
    }
    b.r += (b.tr - b.r) * Math.min(1, dt * 14);
    for (let i = 0; i < 3; i++) b.col[i] += (b.tcol[i] - b.col[i]) * Math.min(1, dt * 7);
    // walls
    const bump = (ang, v) => { if (v > 80) { poke(b, ang, Math.min(1.5, v / 600)); if (v > 300) blop(b.r, 'wall'); } };
    if (b.x < b.r) { b.x = b.r; if (b.vx < 0) { bump(Math.PI, -b.vx); b.vx *= -.5; } }
    if (b.x > W - b.r) { b.x = W - b.r; if (b.vx > 0) { bump(0, b.vx); b.vx *= -.5; } }
    if (b.y < b.r) { b.y = b.r; if (b.vy < 0) { bump(-Math.PI / 2, -b.vy); b.vy *= -.5; } }
    if (b.y > H - b.r) { b.y = H - b.r; if (b.vy > 0) { bump(Math.PI / 2, b.vy); b.vy *= -.5; } }
    // jelly: springy rim with neighbour coupling so dents travel around the blob
    const o = b.o, ov = b.ov;
    for (let i = 0; i < N; i++) {
      const a = -170 * o[i] + 380 * (o[(i + N - 1) % N] + o[(i + 1) % N] - 2 * o[i]) - 7 * ov[i];
      ov[i] += a * dt;
    }
    for (let i = 0; i < N; i++) o[i] = Math.max(-.35, Math.min(.35, o[i] + ov[i] * dt));
  }
  // merging
  const L = live();
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i], b = L[j];
    if (a.gone || b.gone) continue;
    if (Math.hypot(a.x - b.x, a.y - b.y) < (a.r + b.r) * .8) merge(a, b);
  }
  blobs = blobs.filter(b => !b.gone || b.gone.t < 1);
}

/* ---------- drawing ---------- */
function makeBg() {
  bg = document.createElement('canvas');
  bg.width = cv.width; bg.height = cv.height;
  const g = bg.getContext('2d');
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--slab').trim() || '#F1F2EC';
  g.fillRect(0, 0, bg.width, bg.height);
  // primed-canvas tooth: fine speckle plus a faint weave
  const n = (bg.width * bg.height) / 55;
  for (let i = 0; i < n; i++) {
    g.fillStyle = Math.random() < .5 ? 'rgba(40,42,50,.05)' : 'rgba(255,255,255,.5)';
    g.fillRect(Math.random() * bg.width, Math.random() * bg.height, DPR, DPR);
  }
  g.strokeStyle = 'rgba(40,42,50,.025)'; g.lineWidth = DPR;
  for (let x = 0; x < bg.width; x += 4 * DPR) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, bg.height); g.stroke(); }
  for (let y = 0; y < bg.height; y += 4 * DPR) { g.beginPath(); g.moveTo(0, y); g.lineTo(bg.width, y); g.stroke(); }
}
function blobPath(b) {
  const pts = [], a = b.as, pinch = b.holders.length === 2 ? (a - 1) * .38 : 0;
  for (let i = 0; i < N; i++) {
    const th = i / N * TAU, t = th - b.ax, c = Math.cos(t), s = Math.sin(t);
    let e = 1 / Math.sqrt((c / a) ** 2 + (s * a) ** 2);
    e *= 1 - pinch * s * s;
    const rr = b.r * (1 + b.o[i]) * e;
    pts.push([b.x + Math.cos(th) * rr, b.y + Math.sin(th) * rr]);
  }
  const p = new Path2D();
  const mid = (u, v) => [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2];
  let m = mid(pts[N - 1], pts[0]); p.moveTo(m[0], m[1]);
  for (let i = 0; i < N; i++) { const q = pts[i], m2 = mid(q, pts[(i + 1) % N]); p.quadraticCurveTo(q[0], q[1], m2[0], m2[1]); }
  p.closePath();
  return p;
}
function drawBlob(b) {
  if (b.r < .5) return;
  const p = blobPath(b), col = css(b.col);
  ctx.save();
  ctx.shadowColor = 'rgba(28,30,45,.26)'; ctx.shadowBlur = 10 * DPR; ctx.shadowOffsetY = 4 * DPR;
  ctx.fillStyle = col; ctx.fill(p);
  ctx.restore();
  ctx.save(); ctx.clip(p);
  const rim = ctx.createRadialGradient(b.x, b.y, b.r * .4, b.x, b.y, b.r * 1.25);
  rim.addColorStop(0, 'rgba(0,0,0,0)'); rim.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = rim; ctx.fill(p);
  const hx = b.x - b.r * .35, hy = b.y - b.r * .4;
  const hl = ctx.createRadialGradient(hx, hy, 0, hx, hy, b.r * .6);
  hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; ctx.fill(p);
  ctx.restore();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bg) ctx.drawImage(bg, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const b of blobs) if (b.gone) drawBlob(b);
  for (const b of blobs) if (!b.gone) drawBlob(b);
}

/* ---------- loop & sizing ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
  makeBg();
}
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(.05, (t - (last || t)) / 1000); last = t; acc += dt;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const wellsEl = document.getElementById('wells'), paintNameEl = document.getElementById('paintName');
function renderWells() {
  wellsEl.innerHTML = '';
  PAINTS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'well'; btn.style.background = css(p.c);
    btn.setAttribute('aria-label', p.name); btn.setAttribute('aria-pressed', i === sel);
    btn.addEventListener('click', () => { sel = i; renderWells(); });
    wellsEl.appendChild(btn);
  });
  paintNameEl.textContent = PAINTS[sel].name;
}
document.getElementById('clr').addEventListener('click', clearBoard);
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => { soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); if (soundOn) audioUnlock(); });

/* ---------- tilt ---------- */
// Gravity follows the phone's tilt, measured from however it was held when tilt was switched on.
const GRAVITY = 1500, DEAD = 3 * Math.PI / 180;
let tiltOn = false, tiltBase = null, gotTilt = false, tiltTimer = 0;
const grav = { x: 0, y: 0 };
const tiltBtn = document.getElementById('tilt'), toastEl = document.getElementById('toast');
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 3200);
}
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  gotTilt = true;
  const rad = Math.PI / 180;
  if (!tiltBase) tiltBase = { b: e.beta, g: e.gamma };
  const f = v => Math.abs(v) < DEAD ? 0 : Math.sin(Math.max(-1.2, Math.min(1.2, v - Math.sign(v) * DEAD)));
  let gx = f((e.gamma - tiltBase.g) * rad), gy = f((e.beta - tiltBase.b) * rad);
  // keep "down" pointing down when the screen is rotated
  const ang = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * rad;
  const c = Math.cos(ang), s = Math.sin(ang);
  grav.x = gx * c + gy * s; grav.y = -gx * s + gy * c;
}
function setTilt(on) {
  tiltOn = on; tiltBtn.setAttribute('aria-pressed', on);
  if (on) { tiltBase = null; gotTilt = false; window.addEventListener('deviceorientation', onOrient); }
  else { window.removeEventListener('deviceorientation', onOrient); grav.x = grav.y = 0; }
}
tiltBtn.addEventListener('click', async () => {
  if (tiltOn) { setTilt(false); toast('Tilt off'); return; }
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) { toast('This device has no tilt sensor.'); return; }
  if (typeof DOE.requestPermission === 'function') {
    let res = 'denied';
    try { res = await DOE.requestPermission(); } catch (_) {}
    if (res !== 'granted') { toast('Tilt needs motion access. This viewer may block it; try the page in Safari.'); return; }
  }
  setTilt(true);
  toast('Tilt on. Hold the phone the way you like; that’s level.');
  clearTimeout(tiltTimer);
  tiltTimer = setTimeout(() => {
    if (tiltOn && !gotTilt) { setTilt(false); toast('No tilt readings here. This viewer blocks motion sensors; try the page in Safari.'); }
  }, 1500);
});

window.claude?.hot?.snapshot?.(() => ({ sel, blobs: live().map(b => ({ x: b.x / W, y: b.y / H, r: b.tr, c: b.tcol })) }));
function start(data) {
  data = data || {};
  if (Number.isInteger(data.sel)) sel = data.sel;
  renderWells();
  resize();
  new ResizeObserver(() => {
    const ow = W, oh = H; resize();
    if (!seeded && W > 0 && H > 0) { seeded = true; if (!blobs.length) seed(); }
    else if (ow && oh) for (const b of blobs) { b.x *= W / ow; b.y *= H / oh; }
  }).observe(cv);
  if (Array.isArray(data.blobs) && data.blobs.length && W > 0) {
    seeded = true;
    for (const s of data.blobs) { const b = makeBlob(s.x * W, s.y * H, s.r, s.c); blobs.push(b); }
    hintEl.classList.add('hide');
  } else if (W > 0 && H > 0) { seeded = true; seed(); }
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
