<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps Admin — Tech Rabbi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f1b2d; --navy-card: #162440; --navy-deep: #0b1422;
  --gold: #d4a853; --gold-soft: #e8c97a; --cream: #eee8db; --slate: #9aa3b4;
  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
  --radius-sm: 4px; --radius-md: 12px;
  --line: rgba(255,255,255,0.08); --line-gold: rgba(212,168,83,0.25);
  --danger: #e0a3a3; --ok: #7fc9a4;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--navy); color: var(--cream);
  font-family: 'DM Sans', sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: var(--gold); }

header.bar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-md);
  flex-wrap: wrap; padding: var(--space-md) var(--space-xl);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--navy); z-index: 50;
}
.bar h1 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin: 0; }
.bar h1 span { color: var(--gold); }
.bar .who { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--slate); }
.bar .actions { display: flex; gap: var(--space-sm); align-items: center; }

main { max-width: 1100px; margin: 0 auto; padding: var(--space-xl); }

button, .btn {
  font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600;
  border-radius: 999px; padding: 0.5rem 1.1rem; cursor: pointer;
  border: 1px solid transparent; text-decoration: none; display: inline-block;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
}
.btn-primary { background: var(--gold); color: var(--navy); }
.btn-primary:hover:not(:disabled), .btn-primary:focus-visible { background: var(--gold-soft); }
.btn-ghost { background: transparent; color: var(--slate); border-color: var(--line); }
.btn-ghost:hover:not(:disabled), .btn-ghost:focus-visible { color: var(--gold); border-color: var(--line-gold); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------------------------------------------------------- sign in ----- */

.signin {
  max-width: 380px; margin: 12vh auto; background: var(--navy-card);
  border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-xl);
}
.signin h2 { font-family: 'Playfair Display', serif; margin: 0 0 var(--space-xs); font-size: 1.4rem; }
.signin p { color: var(--slate); font-size: 0.88rem; margin: 0 0 var(--space-lg); }
label { display: block; font-size: 0.8rem; color: var(--slate); margin-bottom: var(--space-xs); }
input[type="email"], input[type="password"], input[type="text"], textarea, select {
  width: 100%; background: var(--navy-deep); color: var(--cream);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 0.6rem 0.75rem; font-family: inherit; font-size: 16px; margin-bottom: var(--space-md);
  transition: border-color 0.2s ease;
}
input:focus, textarea:focus, select:focus { border-color: var(--gold); outline: none; }
textarea { resize: vertical; min-height: 62px; line-height: 1.5; }
.error { color: var(--danger); font-size: 0.82rem; margin: 0 0 var(--space-md); min-height: 1.2em; }

/* ------------------------------------------------------------- rows ----- */

.mode-note {
  background: rgba(212,168,83,0.1); border: 1px solid var(--line-gold);
  border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md);
  font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--gold);
  margin-bottom: var(--space-lg);
}
h2.cat {
  font-family: 'Playfair Display', serif; font-size: 1.15rem; margin: var(--space-xl) 0 var(--space-md);
  padding-bottom: var(--space-xs); border-bottom: 1px solid var(--line-gold);
}
.row {
  display: grid; grid-template-columns: 132px 1fr auto; gap: var(--space-md);
  align-items: start; background: var(--navy-card); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: var(--space-md); margin-bottom: var(--space-sm);
  transition: border-color 0.2s ease, opacity 0.2s ease;
}
.row:hover { border-color: var(--line-gold); }
.row.hidden-row { opacity: 0.55; border-style: dashed; }
.row.hidden-row:hover, .row.open { opacity: 1; }
.row img { width: 132px; aspect-ratio: 16/10; object-fit: cover; object-position: top;
  border-radius: var(--radius-sm); background: var(--navy-deep); display: block; }
.row .name { font-weight: 700; font-size: 1rem; margin: 0 0 2px; }
.row .name a { color: var(--cream); text-decoration: none; }
.row .name a:hover { color: var(--gold); }
.row .desc { color: var(--slate); font-size: 0.86rem; margin: 0 0 var(--space-sm); }
.row .chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.chip {
  font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor; line-height: 1.4; color: #8fb3d6;
}
.chip[data-kind="staff"] { color: var(--danger); }
.chip[data-kind="wip"] { color: var(--gold); }
.chip[data-kind="new"] { color: var(--ok); }
.chip[data-kind="archived"] { color: var(--slate); }
.chip[data-kind="hidden"] { color: #c58fd6; }
.chip.edited { color: var(--gold); }
.row .controls { display: flex; flex-direction: column; gap: var(--space-xs); align-items: stretch; }
.row .controls button { font-size: 0.75rem; padding: 0.35rem 0.8rem; white-space: nowrap; }

/* ------------------------------------------------------------ editor ---- */

.editor {
  grid-column: 1 / -1; border-top: 1px solid var(--line);
  margin-top: var(--space-sm); padding-top: var(--space-md);
}
.editor .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-md); }
.preset-labels { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-bottom: var(--space-md); }
.preset-labels button {
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 4px 10px; background: transparent;
  border: 1px solid var(--line); color: var(--slate);
}
.preset-labels button[aria-pressed="true"] { color: var(--navy); background: var(--gold); border-color: var(--gold); }
.label-list { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-bottom: var(--space-md); }
.label-list .chip { display: inline-flex; align-items: center; gap: 6px; }
.label-list .chip button {
  background: none; border: none; color: inherit; padding: 0; font-size: 0.9rem;
  line-height: 1; cursor: pointer; border-radius: 2px;
}
.add-label { display: flex; gap: var(--space-sm); align-items: flex-start; }
.add-label input { margin-bottom: 0; }
.editor-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-md); flex-wrap: wrap; }
.hint { color: var(--slate); font-size: 0.75rem; margin: 0 0 var(--space-sm); }

.toast {
  position: fixed; bottom: var(--space-lg); left: 50%; transform: translateX(-50%) translateY(150%);
  background: var(--navy-card); border: 1px solid var(--line-gold); color: var(--cream);
  padding: 0.7rem 1.3rem; border-radius: 999px; font-size: 0.85rem;
  transition: transform 0.25s ease; z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

@media (max-width: 700px) {
  header.bar, main { padding: var(--space-md); }
  .row { grid-template-columns: 1fr; }
  .row img { width: 100%; }
  .row .controls { flex-direction: row; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>Apps <span>Admin</span></h1>
  <div class="actions">
    <span class="who" id="who"></span>
    <a class="btn btn-ghost" href="./">View page</a>
    <button class="btn btn-ghost" id="signOut" hidden>Sign out</button>
  </div>
</header>

<main>
  <div id="signinWrap" hidden>
    <form class="signin" id="signinForm">
      <h2>Sign in</h2>
      <p id="signinNote">Admin access for the apps directory.</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <p class="error" id="signinError" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="signinBtn">Sign in</button>
    </form>
  </div>

  <div id="panel" hidden>
    <div class="mode-note" id="modeNote"></div>
    <div id="rows"></div>
    <div class="editor-actions" style="margin-top:var(--space-xl)">
      <button class="btn btn-ghost" id="resetAll">Reset every change</button>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { storeReady, merge } from './store.js';

const PRESETS = ['Staff Only', 'Work in Progress', 'New', 'Experiment', 'Archived'];
const LABEL_KIND = {
  'staff only': 'staff', 'work in progress': 'wip', 'new': 'new',
  'archived': 'archived', 'experiment': 'custom',
};
const kindFor = (l) => LABEL_KIND[l.trim().toLowerCase()] || 'custom';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let catalog, store, overrides = {}, openId = null;

const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* Current effective values for one app, catalog plus overrides. */
const effective = (id) => merge(catalog, overrides).find((a) => a.id === id);

function rowHTML(app) {
  const chips = [];
  if (app.hidden) chips.push('<span class="chip" data-kind="hidden">Hidden</span>');
  app.labels.forEach((l) => chips.push(`<span class="chip" data-kind="${kindFor(l)}">${esc(l)}</span>`));
  if (app.edited) chips.push('<span class="chip edited">Edited</span>');

  return `
  <div class="row${app.hidden ? ' hidden-row' : ''}${openId === app.id ? ' open' : ''}" data-id="${app.id}">
    <img src="shots/${esc(app.shot || app.id)}.webp" alt="" loading="lazy">
    <div>
      <p class="name"><a href="${esc(app.url)}" target="_blank" rel="noopener">${esc(app.name)}</a></p>
      <p class="desc">${esc(app.desc)}</p>
      <div class="chips">${chips.join('')}</div>
    </div>
    <div class="controls">
      <button class="btn btn-ghost" data-act="toggle">${app.hidden ? 'Show' : 'Hide'}</button>
      <button class="btn btn-ghost" data-act="edit">${openId === app.id ? 'Close' : 'Edit'}</button>
    </div>
    ${openId === app.id ? editorHTML(app) : ''}
  </div>`;
}

function editorHTML(app) {
  const presets = PRESETS.map((p) => {
    const on = app.labels.some((l) => l.toLowerCase() === p.toLowerCase());
    return `<button type="button" data-preset="${esc(p)}" aria-pressed="${on}">${esc(p)}</button>`;
  }).join('');

  const current = app.labels.map((l) =>
    `<span class="chip" data-kind="${kindFor(l)}">${esc(l)}
       <button type="button" data-remove="${esc(l)}" aria-label="Remove label ${esc(l)}">&times;</button>
     </span>`).join('') || '<span class="hint">No labels.</span>';

  const cats = catalog.categories.map((c) =>
    `<option value="${c.id}"${c.id === app.cat ? ' selected' : ''}>${esc(c.name)}</option>`).join('');

  return `
  <div class="editor">
    <p class="hint">Labels</p>
    <div class="preset-labels">${presets}</div>
    <div class="label-list">${current}</div>
    <div class="add-label">
      <input type="text" data-field="newLabel" placeholder="Add another label" aria-label="New label">
      <button class="btn btn-ghost" type="button" data-act="addLabel">Add</button>
    </div>

    <div class="field-grid" style="margin-top:var(--space-md)">
      <div>
        <label for="cat-${app.id}">Section</label>
        <select id="cat-${app.id}" data-field="cat">${cats}</select>
      </div>
      <div>
        <label for="shot-${app.id}">Screenshot file (in shots/, without .webp)</label>
        <input type="text" id="shot-${app.id}" data-field="shot" value="${esc(app.shot || '')}"
               placeholder="${esc(app.id)}">
      </div>
    </div>

    <label for="desc-${app.id}">Description</label>
    <textarea id="desc-${app.id}" data-field="desc">${esc(app.desc)}</textarea>

    <div class="editor-actions">
      <button class="btn btn-primary" type="button" data-act="save">Save</button>
      <button class="btn btn-ghost" type="button" data-act="revert">Revert to original</button>
    </div>
  </div>`;
}

function paint() {
  const all = merge(catalog, overrides);
  document.getElementById('rows').innerHTML = catalog.categories.map((cat) => {
    const apps = all.filter((a) => a.cat === cat.id);
    if (!apps.length) return '';
    return `<h2 class="cat">${esc(cat.name)}</h2>${apps.map(rowHTML).join('')}`;
  }).join('');
}

/* -------------------------------------------------------------- events -- */

document.getElementById('rows').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const row = btn.closest('.row');
  if (!row) return;
  const id = row.dataset.id;
  const app = effective(id);

  if (btn.dataset.act === 'toggle') {
    await store.save(id, { hidden: !app.hidden || null });
    toast(app.hidden ? `${app.name} is visible` : `${app.name} is hidden`);
    return;
  }
  if (btn.dataset.act === 'edit') { openId = openId === id ? null : id; paint(); return; }

  if (btn.dataset.preset) {
    const label = btn.dataset.preset;
    const has = app.labels.some((l) => l.toLowerCase() === label.toLowerCase());
    const labels = has
      ? app.labels.filter((l) => l.toLowerCase() !== label.toLowerCase())
      : [...app.labels, label];
    await store.save(id, { labels });
    return;
  }
  if (btn.dataset.remove) {
    await store.save(id, { labels: app.labels.filter((l) => l !== btn.dataset.remove) });
    return;
  }
  if (btn.dataset.act === 'addLabel') {
    const input = row.querySelector('[data-field="newLabel"]');
    const value = input.value.trim();
    if (!value) return;
    if (app.labels.some((l) => l.toLowerCase() === value.toLowerCase())) { input.value = ''; return; }
    await store.save(id, { labels: [...app.labels, value] });
    return;
  }
  if (btn.dataset.act === 'save') {
    const original = catalog.apps.find((a) => a.id === id);
    const desc = row.querySelector('[data-field="desc"]').value.trim();
    const cat = row.querySelector('[data-field="cat"]').value;
    const shot = row.querySelector('[data-field="shot"]').value.trim();
    await store.save(id, {
      desc: desc === original.desc ? null : desc,
      cat: cat === original.cat ? null : cat,
      shot: shot || null,
    });
    openId = null;
    toast('Saved');
    return;
  }
  if (btn.dataset.act === 'revert') {
    if (!confirm(`Discard every change to ${app.name}?`)) return;
    await store.save(id, {
      hidden: null, labels: null, desc: null, cat: null, shot: null, order: null,
    });
    openId = null;
    toast('Reverted');
  }
});

document.getElementById('rows').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-field="newLabel"]')) {
    e.preventDefault();
    e.target.closest('.add-label').querySelector('[data-act="addLabel"]').click();
  }
});

document.getElementById('resetAll').addEventListener('click', async () => {
  if (!confirm('Discard every hide, label, and description change across all apps?')) return;
  await store.reset();
  openId = null;
  toast('All changes reset');
});

document.getElementById('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signinBtn');
  const err = document.getElementById('signinError');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    await store.signIn(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value,
    );
  } catch (ex) {
    err.textContent = ex && ex.code === 'auth/invalid-credential'
      ? 'That email and password did not match.'
      : (ex.message || 'Sign in failed.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});

document.getElementById('signOut').addEventListener('click', () => store.signOut());

/* ---------------------------------------------------------------- init -- */

(async function init() {
  [catalog, store] = await Promise.all([
    fetch('apps.json').then((r) => r.json()),
    storeReady,
  ]);

  const demo = store.mode === 'mock';
  document.getElementById('modeNote').textContent = demo
    ? 'Demo mode. Changes are saved in this browser only, so nobody else sees them yet. Set USE_FIREBASE in store.js once the Firebase project exists.'
    : 'Live. Changes are saved to Firebase and appear for everyone.';
  if (demo) {
    document.getElementById('signinNote').textContent =
      'Demo mode: any email gets you in, and the password is ignored. Real sign in arrives with Firebase.';
    document.getElementById('password').required = false;
  } else {
    document.getElementById('password').required = true;
  }

  store.onData((next) => { overrides = next || {}; if (store.user()) paint(); });
  store.onAuth((user) => {
    const inPanel = !!user;
    document.getElementById('panel').hidden = !inPanel;
    document.getElementById('signinWrap').hidden = inPanel;
    document.getElementById('signOut').hidden = !inPanel;
    document.getElementById('who').textContent = user ? user.email : '';
    if (inPanel) paint();
  });
})();
</script>
</body>
</html>
