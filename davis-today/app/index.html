<script>
  // v44: the app moved up one level — /davis-today/ is the schedule itself now. This page only
  // exists so a Home Screen icon added before the move still opens something. Same origin, so a
  // standalone window stays standalone across this hop.
  //
  // The v43 service worker was registered with scope /davis-today/app/ and would otherwise go on
  // serving its cached copy of the old app forever, so retire it and drop its caches first. The
  // redirect runs either way: a failed cleanup must never strand someone on a blank page.
  (function () {
    var target = "/davis-today/";
    var go = function () { location.replace(target); };
    var done = false;
    var once = function () { if (!done) { done = true; go(); } };
    setTimeout(once, 1500);                       // never wait longer than this
    var jobs = [];
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (e) {}
    (jobs.length ? Promise.all(jobs) : Promise.resolve()).then(once, once);
  })();
</script>
