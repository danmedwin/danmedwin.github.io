<title>What Makes Davis, Davis? · Results</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --navy:#003060; --teal:#0098a1; --teal-2:#0f7e8f; --gold:#ffc64a; --sky:#74d2e7;
  --ink:#14213a; --ink-2:#4a5670; --ink-3:#7d879c;
  --ground:#f2f5f9; --paper:#ffffff; --line:#d3dbe6; --line-2:#e6ebf2; --released:#eef1f5; --ok:#2e7d5b;
}
html{font-size:16px}
@media (min-width:900px){html{font-size:20px}}
@media (min-width:1500px){html{font-size:24px}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:.9rem}
header svg{height:2.4rem;width:auto;fill:var(--teal);flex:none}
header .t1{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:600}
header .t2{font-family:"Newsreader",Georgia,serif;font-size:1.4rem;line-height:1.1}
header .stat{margin-left:auto;text-align:right;font-size:.85rem;color:#dbe6f2;font-variant-numeric:tabular-nums}
header .stat b{display:block;color:#fff;font-size:1.2rem;font-weight:600}
nav{display:flex;gap:.3rem;padding:.55rem 1.2rem;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:wrap}
nav button{font:inherit;font-size:.8rem;font-weight:600;padding:.4rem .75rem;border-radius:.4rem;border:1px solid var(--line);background:var(--paper);color:var(--navy);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav button:focus-visible,footer button:focus-visible{outline:3px solid var(--gold)}
main{flex:1;width:100%;max-width:70rem;margin:0 auto;padding:1.2rem 1.2rem 5rem}
.kicker{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-2);font-weight:700}
h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:2rem;margin:.1rem 0 .4rem;line-height:1.1;text-wrap:balance}
.sub{color:var(--ink-2);margin:0 0 1rem;font-size:1rem}
.empty{color:var(--ink-3);font-size:1.1rem;padding:2rem 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.7rem}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:.5rem;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.15rem}
.tile b{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.15rem;line-height:1.15}
.tile .r{color:var(--ink-3);font-size:.85rem}
.tile .s{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-2);margin-top:.3rem}
.tile.done{border-color:var(--ok);background:#f1f8f4}
.tile.done .s{color:var(--ok)}
.rows{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) auto;column-gap:1rem;row-gap:.55rem;align-items:center;font-variant-numeric:tabular-nums}
.rows .ph{font-family:"Newsreader",Georgia,serif;font-size:1.05rem;line-height:1.2;text-align:right}
.rows .bar{height:1.3rem;background:var(--released);border-radius:.25rem;position:relative;overflow:hidden}
.rows .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);opacity:.6}
.rows .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:.25rem}
.rows .n{font-weight:700;color:var(--navy);font-size:1.2rem;min-width:2ch;text-align:right}
.legend{display:flex;gap:1.2rem;font-size:.85rem;color:var(--ink-3);margin-top:1rem;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:.8rem;height:.8rem;margin-right:.4rem;vertical-align:-.05rem;border-radius:.15rem}
.legend .a::before{background:var(--navy)}
.legend .b::before{background:var(--gold);opacity:.6}
.quote{background:var(--paper);border-left:6px solid var(--gold);padding:1.2rem 1.5rem;border-radius:0 .5rem .5rem 0;font-family:"Newsreader",Georgia,serif;font-size:1.75rem;line-height:1.3;text-wrap:pretty;white-space:pre-wrap}
.quote small{display:block;margin-top:.9rem;font-family:"Source Sans 3",sans-serif;font-size:.85rem;color:var(--ink-3);letter-spacing:.04em}
.all{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:.7rem}
.all .quote{font-size:1.05rem;padding:.8rem 1rem;border-left-width:4px}
.phrase{font-family:"Newsreader",Georgia,serif;font-size:2.2rem;color:var(--navy);margin:.2rem 0 .8rem;line-height:1.1}
.shlist{display:flex;flex-direction:column;gap:.6rem}
.shlist .quote{font-size:1.25rem;padding:.8rem 1.1rem}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:.6rem 1.2rem;display:flex;align-items:center;gap:.7rem;font-size:.8rem;color:var(--ink-3);flex-wrap:wrap}
footer .nav{display:flex;gap:.4rem}
footer button{font:inherit;font-weight:700;font-size:1rem;width:2.4rem;height:2.4rem;border-radius:.4rem;border:1px solid var(--line);background:var(--paper);color:var(--navy);cursor:pointer}
footer button.txt{width:auto;padding:0 .7rem;font-size:.8rem;font-weight:600}
footer button:disabled{opacity:.35;cursor:default}
footer .pos{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);min-width:4ch}
footer .spacer{flex:1}
footer a{color:var(--teal-2)}
.badge{position:fixed;top:.4rem;right:.4rem;background:var(--gold);color:var(--navy);font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:.3rem;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

125.137451 1059.111084 167.111084 C 1059.111084 209.084778 1011.205627 243.111084 952.111145 243.111084 C 893.016663 243.111084 845.111145 209.084778 845.111145 167.111084 C 845.111145 125.137451 893.016663 91.111084 952.111145 91.111084 Z M 728.888916 0.222229 C 787.983398 0.222229 835.888916 34.248596 835.888916 76.222229 C 835.888916 118.195862 787.983398 152.222229 728.888916 152.222229 C 669.794434 152.222229 621.888916 118.195862 621.888916 76.222229 C 621.888916 34.248596 669.794434 0.222229 728.888916 0.222229 Z"/></svg>
  <div><div class="t1">The Davis Academy · Faculty Meeting · September 8, 2026</div><div class="t2">What Makes Davis, Davis?</div></div>
  <div class="stat" id="stat"></div>
</header>
<nav id="tabs"></nav>
<main id="view"><div class="empty">Loading…</div></main>
<footer>
  <div class="nav"><button type="button" id="prev" aria-label="Previous">‹</button><span class="pos" id="pos"></span><button type="button" id="next" aria-label="Next">›</button><button type="button" class="txt" id="all">Show all</button></div>
  <span id="hint">Arrow keys: ← → move within a section, ↑ ↓ change section</span>
  <span class="spacer"></span>
  <span id="updated"></span>
  <a id="sheet" href="#" hidden>Open the spreadsheet</a>
</footer>
<script type="application/json" id="boot"><?!= JSON.stringify({session: session, phrases: phrases}) ?></script>
<script>
const DEFAULT_PHRASES = ["Reform Jewish Day School","Academically challenging environment","Enriched curricula","Integration of general academics and Judaic studies","Nurturing environment","Secure environment","Faculty dedicated to excellence","Children encouraged to reach their highest potential","Lifelong love of learning","Commitment to Jewish life","Morals, values, and ethics","Grounded in Torah"];
let PHRASES = DEFAULT_PHRASES;
try { PHRASES = JSON.parse(document.getElementById('boot').textContent).phrases; } catch (e) {}
const LIVE = typeof google !== 'undefined' && google.script && google.script.run;
if (!LIVE) { const b = document.createElement('div'); b.className = 'badge'; b.textContent = 'Preview mode'; document.body.appendChild(b); }

const TABS = [
  { id: 'groups', label: 'Groups' },
  { id: 'three', label: 'The final three' },
  { id: 'shadow', label: 'The shadow' },
  { id: 'unique', label: 'Uniquely Davis', field: 'unique', q: 'What truly distinguishes Davis from other excellent schools?' },
  { id: 'essential', label: 'Essential Davis', field: 'essential', q: 'Not unique to Davis, but we could not imagine Davis without it.' },
  { id: 'aspirational', label: 'Aspirational Davis', field: 'aspirational', q: 'Something we deeply value and want to become even better at.' },
  { id: 'missing', label: 'Missing Davis', field: 'missing', q: 'Essential to who Davis is, but not among our twelve phrases.' },
  { id: 'pitch', label: 'Make your case', field: 'pitch', q: '"What makes Davis different from another excellent private school?"' }
];
let data = { groups: [] }, tab = 0, idx = {}, showAll = false;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tag = (g) => esc(g.groupName || 'Unnamed group') + (g.room ? ' · Room ' + esc(g.room) : '');
const roomKey = (g) => { const n = parseFloat(g.room); return isNaN(n) ? [1, String(g.room || '').toLowerCase()] : [0, n]; };
const byRoom = (a, b) => { const x = roomKey(a), y = roomKey(b); return x[0] - y[0] || (x[1] < y[1] ? -1 : x[1] > y[1] ? 1 : 0) || String(a.groupName).localeCompare(String(b.groupName)); };

function load() {
  const done = (d) => { data = d || { groups: [] }; render(); $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }); if (d && d.sheetUrl) { $('#sheet').href = d.sheetUrl; $('#sheet').hidden = false; } };
  if (LIVE) google.script.run.withSuccessHandler(done).withFailureHandler(e => { $('#updated').textContent = 'Could not refresh: ' + (e.message || e); }).getBoard();
  else { let g = []; try { g = JSON.parse(localStorage.getItem('davis-mission.mock')) || []; } catch (e) {} done({ groups: g, phrases: PHRASES, sheetUrl: '' }); }
}

function items() {
  const t = TABS[tab], gs = data.groups.slice().sort(byRoom);
  if (t.field) return gs.filter(g => (g[t.field] || '').trim()).map(g => ({ text: g[t.field].trim(), tag: tag(g) }));
  if (t.id === 'shadow') {
    const counts = threeCounts();
    return PHRASES.map((p, i) => ({ i, p, notes: gs.filter(g => (g.three || []).includes(i) && ((g.shadow || {})[i] || '').trim()).map(g => ({ text: g.shadow[i].trim(), tag: tag(g) })) }))
      .filter(x => x.notes.length).sort((a, b) => counts[b.i] - counts[a.i] || a.i - b.i);
  }
  return [];
}
function threeCounts() { const c = PHRASES.map(() => 0); data.groups.forEach(g => { if ((g.part || 1) >= 4) (g.three || []).forEach(i => c[i]++); }); return c; }
// (three and six are stored in tap order; the board sorts by count, so order never matters here)
function sixCounts() { const c = PHRASES.map(() => 0); data.groups.forEach(g => { if ((g.part || 1) >= 2) (g.six || []).forEach(i => c[i]++); }); return c; }

function render() {
  const t = TABS[tab];
  $('#tabs').innerHTML = TABS.map((x, i) => `<button type="button" class="${i === tab ? 'on' : ''}" data-i="${i}">${x.label}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = +b.dataset.i; render(); });
  const gs = data.groups, sub = gs.filter(g => g.submittedAt).length;
  $('#stat').innerHTML = `<b>${sub} of ${gs.length}</b>${gs.length === 1 ? 'group' : 'groups'} submitted`;
  const v = $('#view');
  const list = items();
  const nav = t.field || t.id === 'shadow';
  ['prev', 'next', 'all', 'pos'].forEach(id => $('#' + id).style.visibility = nav ? 'visible' : 'hidden');
  if (nav) { idx[t.id] = Math.min(Math.max(0, idx[t.id] || 0), Math.max(0, list.length - 1)); }

  if (t.id === 'groups') {
    v.innerHTML = `<div class="kicker">Where everyone is</div><h2>Groups</h2><p class="sub">This page refreshes on its own every few seconds.</p>`
      + (gs.length ? `<div class="tiles">${gs.slice().sort(byRoom).map(g => `<div class="tile ${g.submittedAt ? 'done' : ''}"><b>${esc(g.groupName || 'Unnamed group')}</b><span class="r">${g.room ? 'Room ' + esc(g.room) : '&nbsp;'}${g.members ? ' · ' + esc(g.members) : ''}</span><span class="s">${g.submittedAt ? 'Submitted' : 'Part ' + Math.min(4, g.part || 1) + ' of 4'}</span></div>`).join('')}</div>`
        : `<div class="empty">No groups have started yet.</div>`);
  } else if (t.id === 'three') {
    const tc = threeCounts(), sc = sixCounts();
    const nThree = gs.filter(g => (g.part || 1) >= 4).length, nSix = gs.filter(g => (g.part || 1) >= 2).length;
    const denom = Math.max(1, nSix, nThree);
    const order = PHRASES.map((p, i) => i).sort((a, b) => tc[b] - tc[a] || sc[b] - sc[a] || a - b);
    v.innerHTML = `<div class="kicker">What made the cut</div><h2>The final three</h2><p class="sub">How many groups kept each phrase.</p>
      <div class="rows">${order.map(i => `<div class="ph">${esc(PHRASES[i])}</div><div class="bar"><i style="width:${sc[i] / denom * 100}%"></i><b style="width:${tc[i] / denom * 100}%"></b></div><div class="n">${tc[i]}</div>`).join('')}</div>
      <div class="legend"><span class="a">In the final three (${nThree} ${nThree === 1 ? 'group' : 'groups'} so far)</span><span class="b">Survived the first cut, top six (${nSix})</span></div>`;
  } else if (t.id === 'shadow') {
    if (!list.length) v.innerHTML = `<div class="kicker">What a visitor would see</div><h2>The shadow</h2><div class="empty">No observations yet.</div>`;
    else if (showAll) v.innerHTML = `<div class="kicker">What a visitor would see</div><h2>The shadow</h2>` + list.map(x => `<div class="phrase" style="font-size:1.4rem;margin-top:1rem">${esc(x.p)}</div><div class="all">${x.notes.map(n => `<div class="quote">${esc(n.text)}<small>${n.tag}</small></div>`).join('')}</div>`).join('');
    else { const x = list[idx[t.id]]; v.innerHTML = `<div class="kicker">What a visitor would see · ${x.notes.length} ${x.notes.length === 1 ? 'group' : 'groups'}</div><div class="phrase">${esc(x.p)}</div><div class="shlist">${x.notes.map(n => `<div class="quote">${esc(n.text)}<small>${n.tag}</small></div>`).join('')}</div>`; }
  } else {
    const head = `<div class="kicker">${t.label}</div><h2>${esc(t.q)}</h2>`;
    if (!list.length) v.innerHTML = head + `<div class="empty">No answers yet.</div>`;
    else if (showAll) v.innerHTML = head + `<div class="all">${list.map(x => `<div class="quote">${esc(x.text)}<small>${x.tag}</small></div>`).join('')}</div>`;
    else { const x = list[idx[t.id]]; v.innerHTML = head + `<div class="quote">${esc(x.text)}<small>${x.tag}</small></div>`; }
  }
  $('#pos').textContent = nav && list.length ? (showAll ? list.length + ' total' : (idx[t.id] + 1) + ' of ' + list.length) : '';
  $('#prev').disabled = !nav || showAll || !list.length || idx[t.id] <= 0;
  $('#next').disabled = !nav || showAll || !list.length || idx[t.id] >= list.length - 1;
  $('#all').textContent = showAll ? 'One at a time' : 'Show all';
}
function move(d) { const t = TABS[tab]; if (!(t.field || t.id === 'shadow') || showAll) return; const n = items().length; idx[t.id] = Math.min(Math.max(0, (idx[t.id] || 0) + d), Math.max(0, n - 1)); render(); }
$('#prev').onclick = () => move(-1);
$('#next').onclick = () => move(1);
$('#all').onclick = () => { showAll = !showAll; render(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); tab = (tab + 1) % TABS.length; render(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); tab = (tab + TABS.length - 1) % TABS.length; render(); }
  else if (e.key === 'a' || e.key === 'A') { showAll = !showAll; render(); }
  else if (e.key >= '1' && e.key <= '8') { tab = +e.key - 1; render(); }
});
load();
setInterval(load, 8000);
</script>
