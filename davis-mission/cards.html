<style>
:root{--navy:#003060;--teal:#0098a1;--gold:#ffc64a;--ink:#14213a;--ink-2:#4a5670;--line:#c9d3e0}
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;color:var(--ink);font-family:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
.bar{background:var(--navy);color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:2}
.bar b{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.15rem}
.bar label{display:flex;align-items:center;gap:.4rem;font-size:.95rem}
.bar input{width:4rem;font:inherit;padding:.3rem .4rem;border-radius:.3rem;border:0}
.bar button{font:inherit;font-weight:700;background:var(--gold);color:var(--navy);border:0;border-radius:.4rem;padding:.5rem 1rem;cursor:pointer}
.bar span{color:#a9bdd6;font-size:.9rem}
.sheet{background:#fff;width:8.5in;min-height:11in;margin:.5in auto;padding:.5in;box-shadow:0 2px 12px rgba(0,0,0,.12);page-break-after:always;break-after:page}
.cards{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:3.05in;gap:.2in}
.card{border:1.5px solid var(--navy);border-radius:.14in;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:.35in .3in;font-family:"Newsreader",Georgia,serif;font-size:22pt;line-height:1.15;color:var(--navy);text-wrap:balance}
.card svg{position:absolute;left:.16in;top:.14in;height:.3in;fill:var(--teal)}
.card small{position:absolute;right:.16in;bottom:.12in;font-family:"Source Sans 3",sans-serif;font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:#8b97ab}
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;height:10in}
.cover svg.logo{height:1.4in;fill:var(--teal);margin:.2in 0 .1in}
.cover .kicker{font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
.cover h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:34pt;margin:.05in 0 .15in;color:var(--navy)}
.cover .qr{width:2.9in;height:2.9in;margin:.1in 0}
.cover .qr svg,.cover .qr img,.cover .qr canvas{width:100%!important;height:100%!important;display:block}
.cover .url{font-weight:700;font-size:15pt;color:var(--navy);letter-spacing:.02em}
.cover ol{text-align:left;max-width:5.6in;font-size:12.5pt;line-height:1.45;color:var(--ink-2);padding-left:1.1em;margin:.25in 0}
.cover ol b{color:var(--ink)}
.cover .lines{width:5.6in;margin-top:auto;display:grid;grid-template-columns:2fr 1fr;gap:.3in;font-size:11pt;color:var(--ink-2)}
.cover .lines div{border-bottom:1px solid var(--navy);padding-bottom:.05in;text-align:left}
@page{size:letter;margin:0}
@media print{
  body{background:#fff}
  .bar{display:none}
  .sheet{margin:0;box-shadow:none;width:8.5in;height:11in;padding:.5in}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<div class="bar"><b>Card packets</b><label>Sets <input id="n" type="number" min="1" max="30" value="1"></label><button id="print">Print</button><span>Each set is three letter-size pages: a cover with the QR code, then the twelve cards. Cut on the borders.</span></div>

<script>
const PHRASES = ["Reform Jewish Day School","Academically challenging environment","Enriched curricula","Integration of general academics and Judaic studies","Nurturing environment","Secure environment","Faculty dedicated to excellence","Children encouraged to reach their highest potential","Lifelong love of learning","Commitment to Jewish life","Morals, values, and ethics","Grounded in Torah"];
const logo = document.getElementById('tpl-logo').innerHTML;
const KEY = new URLSearchParams(location.search).get('key') || '';
let qr = document.getElementById('tpl-qr').innerHTML;
if (KEY && window.QRCode) {
  /* A key in the link makes a QR code that admits a group without sign-in. */
  const tmp = document.createElement('div');
  new QRCode(tmp, { text: 'https://techrabbi.org/davis-mission/?key=' + encodeURIComponent(KEY), width: 512, height: 512, colorDark: '#003060', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.Q });
  qr = '<img src="' + tmp.querySelector('canvas').toDataURL('image/png') + '" alt="QR code">';
}
function build() {
  const n = Math.max(1, Math.min(30, parseInt(document.getElementById('n').value, 10) || 1));
  let html = '';
  for (let s = 0; s < n; s++) {
    html += `<div class="sheet"><div class="cover">${logo.replace('<svg', '<svg class="logo"')}
      <div class="kicker">The Davis Academy · Faculty Meeting · September 8, 2026</div><h1>What Makes Davis, Davis?</h1>
      <div class="qr">${qr}</div><div class="url">techrabbi.org/davis-mission</div>
      <ol><li><b>One person scans the code.</b> ${KEY ? 'No sign-in needed.' : 'Sign in with a davisstudent.org Google account when asked.'} One phone per group is enough.</li>
      <li><b>Name your group and room</b> on the phone.</li>
      <li><b>Spread the twelve cards on the table.</b> Sort them there, then tap your choices on the phone so nothing gets lost.</li>
      <li><b>The phone will tell you what comes next</b>, and about how long to spend on each part. You have about 30 minutes before we regroup.</li></ol>
      <div class="lines"><div>Group name</div><div>Room</div></div></div></div>`;
    for (let p = 0; p < 2; p++) {
      html += `<div class="sheet"><div class="cards">` + PHRASES.slice(p * 6, p * 6 + 6).map(ph => `<div class="card">${logo}${ph}<small>What Makes Davis, Davis?</small></div>`).join('') + `</div></div>`;
    }
  }
  document.getElementById('out').innerHTML = html;
}
document.getElementById('n').addEventListener('input', build);
document.getElementById('print').addEventListener('click', () => window.print());
const q = new URLSearchParams(location.search); if (q.get('sets')) document.getElementById('n').value = q.get('sets');
build();
</script>
